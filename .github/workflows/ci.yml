name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  backend:
    name: Backend build (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Boot jar
        run: gradle bootJar -x test --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: build/libs/*.jar
          retention-days: 7

  frontend:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  smoke:
    name: Smoke produccion (salud)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: SPA responde
        run: |
          curl -fsS --retry 5 --retry-delay 10 https://cardtrade-market.vercel.app/ > /dev/null
          echo "frontend OK"

      - name: API salud
        run: |
          for path in /api/cards/featured /api/wishlist/public/health; do
            code=$(curl -fsS --retry 5 --retry-delay 15 -o /dev/null -w '%{http_code}' \
              "https://cardtrademarket-backend.onrender.com${path}") || {
              echo "FAIL ${path} code=${code}"; exit 1; }
            echo "${path} -> ${code}"
          done

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-labelledby="t">
  <title id="t">Sin resultados de búsqueda</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>

  <!-- Cartas de fondo -->
  <g opacity=".35">
    <rect x="70" y="96" width="120" height="168" rx="14" fill="#CBD5E1" transform="rotate(-12 130 180)"/>
    <rect x="330" y="96" width="120" height="168" rx="14" fill="#CBD5E1" transform="rotate(12 390 180)"/>
  </g>

  <!-- Carta central con signo -->
  <g>
    <rect x="186" y="70" width="148" height="206" rx="16" fill="#EFF6FF" stroke="url(#g)" stroke-width="6"/>
    <circle cx="260" cy="156" r="44" fill="#DBEAFE"/>
    <path d="M242 138 l36 36 M278 138 l-36 36" stroke="#3B82F6" stroke-width="12" stroke-linecap="round"/>
    <rect x="210" y="222" width="100" height="12" rx="6" fill="#BFDBFE"/>
    <rect x="222" y="244" width="76" height="10" rx="5" fill="#DBEAFE"/>
  </g>

  <!-- Lupa -->
  <g transform="translate(360 236)">
    <circle cx="0" cy="0" r="52" fill="#fff" fill-opacity=".25" stroke="url(#g)" stroke-width="12"/>
    <path d="M38 38 L86 86" stroke="#1E40AF" stroke-width="16" stroke-linecap="round"/>
    <path d="M-26 -6 a26 26 0 0 1 20 -22" stroke="#fff" stroke-width="8" stroke-linecap="round" fill="none" opacity=".8"/>

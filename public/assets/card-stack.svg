<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" role="img" aria-labelledby="t">
  <title id="t">Pila de cartas coleccionables</title>
  <defs>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Carta trasera (incluida) -->
  <g transform="rotate(-14 150 210)">
    <rect x="66" y="96" width="176" height="244" rx="16" fill="url(#c3)"/>
    <rect x="82" y="112" width="144" height="212" rx="10" fill="#FFF7ED" opacity=".92"/>
    <circle cx="154" cy="218" r="42" fill="#F59E0B" opacity=".45"/>
  </g>

  <!-- Carta central -->
  <g transform="rotate(-5 230 200)">
    <rect x="142" y="74" width="176" height="244" rx="16" fill="url(#c2)"/>
    <rect x="158" y="90" width="144" height="212" rx="10" fill="#ECFDF5" opacity=".95"/>
    <rect x="176" y="112" width="108" height="76" rx="8" fill="#10B981" opacity=".35"/>
    <rect x="176" y="206" width="108" height="12" rx="6" fill="#A7F3D0"/>
    <rect x="176" y="230" width="80" height="12" rx="6" fill="#D1FAE5"/>
  </g>

  <!-- Carta frontal -->
  <g transform="rotate(6 310 190)">
    <rect x="226" y="56" width="176" height="244" rx="16" fill="url(#c1)"/>
    <rect x="242" y="72" width="144" height="212" rx="10" fill="#EFF6FF"/>
    <rect x="258" y="88" width="112" height="96" rx="8" fill="#3B82F6" opacity=".35"/>
    <circle cx="314" cy="136" r="30" fill="#FDE68A"/>
    <rect x="258" y="198" width="112" height="14" rx="7" fill="#BFDBFE"/>
    <rect x="258" y="224" width="76" height="14" rx="7" fill="#DBEAFE"/>
    <rect x="258" y="250" width="96" height="14" rx="7" fill="#EFF6FF"/>
    <rect x="242" y="72" width="144" height="212" rx="10" fill="none" stroke="#1E40AF" stroke-width="3"/>
  </g>
</svg>

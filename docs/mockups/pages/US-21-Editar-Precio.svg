<svg viewBox="0 0 1200 850" xmlns="http://www.w3.org/2000/svg">
  <title>Editar Precio</title>
  <desc>Modal para editar el precio de una publicacion</desc>
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cardShadow"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .header-text{font-size:20px;font-weight:700;fill:white}
    .page-title{font-size:24px;font-weight:700;fill:#111827}
    .modal-title{font-size:22px;font-weight:700;fill:#111827}
    .label{font-size:13px;font-weight:500;fill:#374151}
    .input-text{font-size:16px;fill:#111827}
    .hint{font-size:12px;fill:#92400E}
    .btn-primary{font-size:14px;font-weight:600;fill:white}
    .btn-secondary{font-size:14px;fill:#6B7280}
    .muted{font-size:14px;fill:#6B7280}
    .footer-text{font-size:12px;fill:#9CA3AF}
    .footer-link{font-size:12px;fill:#6B7280}
    .current-price{font-size:14px;fill:#6B7280}
    .card-title{font-size:16px;font-weight:600;fill:#111827}
    .card-subtitle{font-size:12px;fill:#6B7280}
  </style>
  <rect width="1200" height="850" fill="#F3F4F6"/>

  <g id="header">
    <rect width="1200" height="64" fill="url(#headerGrad)"/>
    <text x="40" y="42" class="header-text">&#x1F0CF; CardTrade Market</text>
  </g>

  <g id="main-content">
    <text x="60" y="115" class="page-title">EDITAR PRECIO</text>

    <!-- Card info -->
    <rect x="60" y="140" width="1080" height="140" rx="12" fill="white" filter="url(#cardShadow)"/>
    <rect x="85" y="165" width="100" height="90" rx="10" fill="#FEF3C7"/>
    <text x="135" y="220" text-anchor="middle" font-size="40">&#x1F0CF;</text>
    <text x="210" y="190" class="card-title">Charizard ex 199/165</text>
    <text x="210" y="215" class="card-subtitle">Pokemon &#x2022; Obsidian Flames &#x2022; Ultra Rare</text>
    <text x="210" y="245" class="current-price">Precio actual: $45.00 MXN</text>
    <text x="210" y="270" class="current-price">Publicacion: #199</text>

    <!-- Modal -->
    <rect x="250" y="320" width="700" height="380" rx="16" fill="white" filter="url(#cardShadow)"/>
    <text x="600" y="370" text-anchor="middle" class="modal-title">NUEVO PRECIO</text>

    <text x="300" y="415" class="label">Precio (MXN)</text>
    <rect x="300" y="425" width="600" height="52" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="320" y="460" class="input-text">$52.00</text>

    <rect x="300" y="490" width="600" height="36" rx="6" fill="#FEF3C7"/>
    <text x="600" y="514" text-anchor="middle" class="hint">&#x1F4A1; Precio sugerido: $48 - $55 (basado en ventas recientes)</text>

    <line x1="300" y1="540" x2="900" y2="540" stroke="#E5E7EB" stroke-width="1"/>

    <text x="300" y="575" class="label">Historial de precios</text>
    <text x="300" y="595" class="current-price">$45.00 (1 ene) &#x2192; $50.00 (5 ene) &#x2192; $52.00 (actual)</text>
  </g>

  <g id="footer">
    <rect x="0" y="770" width="1200" height="80" fill="#1F2937"/>
    <text x="600" y="805" text-anchor="middle" class="footer-text">&#xA9; 2026 CardTrade Market. Todos los derechos reservados.</text>
    <text x="600" y="825" text-anchor="middle" class="footer-link">Terminos | Privacidad | Contacto | Ayuda</text>
  </g>
</svg>

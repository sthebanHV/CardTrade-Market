<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
      text { font-family: 'Inter', sans-serif; }
    </style>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E40AF"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#F3F4F6"/>

  <!-- Header -->
  <rect width="1200" height="64" fill="url(#headerGrad)"/>
  <text x="40" y="40" fill="white" font-size="20" font-weight="700">🃏 CardTrade Market</text>
  <rect x="350" y="16" width="400" height="32" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="370" y="37" fill="rgba(255,255,255,0.6)" font-size="14">🔍 Buscar cartas...</text>
  <circle cx="1100" cy="32" r="16" fill="rgba(255,255,255,0.2)"/>
  <text x="1095" y="37" fill="white" font-size="14">🛒</text>
  <circle cx="1150" cy="32" r="16" fill="rgba(255,255,255,0.2)"/>
  <text x="1145" y="37" fill="white" font-size="14">👤</text>

  <!-- Main Content -->
  <rect x="350" y="120" width="500" height="680" rx="12" fill="white" filter="url(#shadow)"/>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="600" y="170" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">CREAR CUENTA</text>
  <text x="600" y="195" text-anchor="middle" font-size="14" fill="#6B7280">Únete a la comunidad de coleccionistas</text>

  <!-- Form -->
  <!-- Username -->
  <text x="400" y="240" font-size="13" font-weight="500" fill="#374151">Nombre de Usuario</text>
  <rect x="400" y="250" width="400" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="420" y="278" fill="#9CA3AF" font-size="14">cardmaster_mx</text>

  <!-- Email -->
  <text x="400" y="315" font-size="13" font-weight="500" fill="#374151">Correo Electrónico</text>
  <rect x="400" y="325" width="400" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="420" y="353" fill="#9CA3AF" font-size="14">📧 usuario@correo.com</text>

  <!-- Password -->
  <text x="400" y="390" font-size="13" font-weight="500" fill="#374151">Contraseña</text>
  <rect x="400" y="400" width="400" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="420" y="428" fill="#9CA3AF" font-size="14">🔒 ••••••••</text>
  <text x="760" y="428" fill="#3B82F6" font-size="12" font-weight="500">Mostrar</text>
  <text x="400" y="460" font-size="11" fill="#6B7280">Mínimo 8 caracteres, 1 mayúscula, 1 número, 1 especial</text>

  <!-- Confirm Password -->
  <text x="400" y="485" font-size="13" font-weight="500" fill="#374151">Confirmar Contraseña</text>
  <rect x="400" y="495" width="400" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="420" y="523" fill="#9CA3AF" font-size="14">🔒 ••••••••</text>

  <!-- Checkbox -->
  <rect x="400" y="560" width="18" height="18" rx="4" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="428" y="574" font-size="13" fill="#374151">Acepto la Política de Privacidad y Términos de Uso</text>

  <!-- Submit Button -->
  <rect x="400" y="600" width="400" height="48" rx="8" fill="#3B82F6"/>
  <text x="600" y="630" text-anchor="middle" fill="white" font-size="15" font-weight="600">CREAR CUENTA</text>

  <!-- Divider -->
  <line x1="400" y1="670" x2="580" y2="670" stroke="#E5E7EB" stroke-width="1"/>
  <text x="600" y="675" text-anchor="middle" font-size="12" fill="#9CA3AF">O regístrate con</text>
  <line x1="620" y1="670" x2="800" y2="670" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Social Buttons -->
  <rect x="400" y="690" width="190" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="495" y="718" text-anchor="middle" font-size="14" fill="#374151">🔵 Google</text>
  <rect x="610" y="690" width="190" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="705" y="718" text-anchor="middle" font-size="14" fill="#374151">🔵 Facebook</text>

  <!-- Login Link -->
  <text x="600" y="765" text-anchor="middle" font-size="14" fill="#6B7280">¿Ya tienes una cuenta? <tspan fill="#3B82F6" font-weight="500">Iniciar sesión</tspan></text>

  <!-- Footer -->
  <text x="600" y="870" text-anchor="middle" font-size="12" fill="#9CA3AF">© 2026 CardTrade Market. Todos los derechos reservados.</text>
</svg>
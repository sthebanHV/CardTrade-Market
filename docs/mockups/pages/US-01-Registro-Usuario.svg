<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <title>Registro de Usuario</title>
  <desc>Wireframe del formulario de registro de usuario con campos de nombre de usuario, correo electronico, contrasena, confirmacion de contrasena, aceptacion de terminos, boton de crear cuenta y opciones de registro social</desc>
  
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .page-title { font-size: 22px; font-weight: 700; fill: #111827; }
    .page-subtitle { font-size: 14px; fill: #6B7280; }
    .section-title { font-size: 18px; font-weight: 700; fill: #111827; }
    .card-title { font-size: 14px; font-weight: 600; fill: #111827; }
    .card-meta { font-size: 12px; fill: #6B7280; }
    .card-price { font-size: 13px; font-weight: 600; fill: #3B82F6; }
    .header-text { font-size: 20px; font-weight: 700; fill: white; }
    .placeholder { font-size: 14px; fill: #9CA3AF; }
    .btn-primary { fill: #3B82F6; }
    .btn-text { font-size: 14px; font-weight: 600; fill: white; }
    .btn-secondary { fill: white; stroke: #D1D5DB; stroke-width: 1.5; }
    .label { font-size: 13px; font-weight: 500; fill: #374151; }
    .input-text { font-size: 14px; fill: #111827; }
    .input-placeholder { font-size: 14px; fill: #9CA3AF; }
    .link { font-size: 13px; fill: #3B82F6; font-weight: 500; }
    .muted { font-size: 14px; fill: #6B7280; }
    .small-muted { font-size: 12px; fill: #6B7280; }
    .hint { font-size: 11px; fill: #6B7280; }
    .footer-text { font-size: 12px; fill: #9CA3AF; }
    .footer-link { font-size: 12px; fill: #6B7280; }
    .stat-text { font-size: 14px; fill: #6B7280; }
    .hero-title { font-size: 32px; font-weight: 700; fill: white; }
    .hero-subtitle { font-size: 18px; fill: rgba(255,255,255,0.85); }
    .tab-active { fill: #3B82F6; }
    .tab-text-active { font-size: 13px; font-weight: 500; fill: white; }
    .tab-text-inactive { font-size: 13px; fill: #6B7280; }
    .info-box { fill: #EFF6FF; stroke: #BFDBFE; stroke-width: 1; }
    .info-text { font-size: 13px; fill: #1E40AF; }
    .info-link { font-size: 12px; fill: #3B82F6; }
  </style>

  <rect width="1200" height="900" fill="#F3F4F6"/>

  <g id="header">
    <rect width="1200" height="64" fill="url(#headerGrad)"/>
    <text x="40" y="42" class="header-text">&#127183; CardTrade Market</text>
    <rect x="350" y="16" width="400" height="32" rx="6" fill="rgba(255,255,255,0.15)"/>
    <text x="370" y="37" class="placeholder">&#128269; Buscar cartas...</text>
    <circle cx="1100" cy="32" r="16" fill="rgba(255,255,255,0.2)"/>
    <text x="1095" y="37" class="header-text" font-size="14">&#128722;</text>
    <circle cx="1150" cy="32" r="16" fill="rgba(255,255,255,0.2)"/>
    <text x="1145" y="37" class="header-text" font-size="14">&#128100;</text>
  </g>

  <g id="main-content">
    <rect x="350" y="120" width="500" height="680" rx="12" fill="white" filter="url(#cardShadow)"/>

    <text x="600" y="170" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">CREAR CUENTA</text>
    <text x="600" y="195" text-anchor="middle" class="muted">&#218;nete a la comunidad de coleccionistas</text>

    <text x="400" y="240" class="label">Nombre de Usuario</text>
    <rect x="400" y="250" width="400" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="420" y="278" class="input-placeholder">cardmaster_mx</text>

    <text x="400" y="315" class="label">Correo Electr&#243;nico</text>
    <rect x="400" y="325" width="400" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="420" y="353" class="input-placeholder">&#128231; usuario@correo.com</text>

    <text x="400" y="390" class="label">Contrase&#241;a</text>
    <rect x="400" y="400" width="400" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="420" y="428" class="input-placeholder">&#128274; &#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;</text>
    <text x="760" y="428" class="link" font-size="12">Mostrar</text>
    <text x="400" y="460" class="hint">M&#237;nimo 8 caracteres, 1 may&#250;scula, 1 n&#250;mero, 1 especial</text>

    <text x="400" y="485" class="label">Confirmar Contrase&#241;a</text>
    <rect x="400" y="495" width="400" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="420" y="523" class="input-placeholder">&#128274; &#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;</text>

    <rect x="400" y="560" width="18" height="18" rx="4" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="428" y="574" class="label">Acepto la Pol&#237;tica de Privacidad y T&#233;rminos de Uso</text>

    <rect x="400" y="600" width="400" height="48" rx="8" fill="#3B82F6"/>
    <text x="600" y="630" text-anchor="middle" fill="white" font-size="15" font-weight="600">CREAR CUENTA</text>

    <line x1="400" y1="670" x2="580" y2="670" stroke="#E5E7EB" stroke-width="1"/>
    <text x="600" y="675" text-anchor="middle" class="small-muted">O reg&#237;strate con</text>
    <line x1="620" y1="670" x2="800" y2="670" stroke="#E5E7EB" stroke-width="1"/>

    <rect x="400" y="690" width="190" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="495" y="718" text-anchor="middle" font-size="14" fill="#374151">&#128309; Google</text>
    <rect x="610" y="690" width="190" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="705" y="718" text-anchor="middle" font-size="14" fill="#374151">&#128293; Facebook</text>

    <text x="600" y="765" text-anchor="middle" class="muted">&#191;Ya tienes una cuenta? <tspan fill="#3B82F6" font-weight="500">Iniciar sesi&#243;n</tspan></text>
  </g>

  <g id="footer">
    <rect x="0" y="820" width="1200" height="80" fill="#1F2937"/>
    <text x="600" y="855" text-anchor="middle" class="footer-text">&#169; 2026 CardTrade Market. Todos los derechos reservados.</text>
    <text x="600" y="875" text-anchor="middle" class="footer-link">T&#233;rminos | Privacidad | Contacto | Ayuda</text>
  </g>
</svg>

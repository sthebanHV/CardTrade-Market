    <circle cx="15" cy="15" r="15" fill="#F59E0B"/>
    <text x="15" y="19" text-anchor="middle" fill="white" font-size="10">📦</text>
    <text x="50" y="22" font-size="14" fill="#111827">Envío entregado: Pedido CT-2025-015189</text>
    <text x="50" y="44" font-size="12" fill="#6B7280">Hace 3 días • DHL Express</text>
  </g>


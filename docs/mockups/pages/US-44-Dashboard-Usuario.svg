    <circle cx="15" cy="15" r="15" fill="#A855F7"/>
    <text x="15" y="19" text-anchor="middle" fill="white" font-size="10">🎯</text>
    <text x="50" y="22" font-size="14" fill="#111827">Completaste set: Base Set 1st Ed.</text>
    <text x="50" y="44" font-size="12" fill="#6B7280">Hace 5 días • Logro desbloqueado</text>

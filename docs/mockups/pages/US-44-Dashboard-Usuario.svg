    <circle cx="15" cy="15" r="15" fill="#10B981"/>
    <text x="15" y="19" text-anchor="middle" fill="white" font-size="10">⭐</text>
    <text x="50" y="22" font-size="14" fill="#111827">Nueva reseña 5★ de CollectorPro</text>
    <text x="50" y="44" font-size="12" fill="#6B7280">Hace 2 días • "Excelente vendedor"</text>
  </g>


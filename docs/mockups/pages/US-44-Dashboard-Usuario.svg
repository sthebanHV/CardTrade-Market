  <rect x="340" y="485" width="220" height="90" rx="12" fill="#F3E8FF" stroke="#D8B4FE" stroke-width="1"/>
  <text x="450" y="525" text-anchor="middle" font-size="28">📊</text>
  <text x="450" y="550" text-anchor="middle" class="btn-primary" fill="#A855F7">Analytics</text>


<svg viewBox="0 0 1200 960" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .title { font-size: 24px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 14px; fill: #6B7280; }
    .section-title { font-size: 18px; font-weight: 700; fill: #111827; }
    .stat-value { font-size: 32px; font-weight: 700; }
    .stat-label { font-size: 14px; fill: #6B7280; }
    .stat-delta { font-size: 12px; }
    .card-title { font-size: 13px; font-weight: 600; fill: #111827; }
    .card-meta { font-size: 12px; fill: #6B7280; }
    .card-delta { font-size: 12px; font-weight: 600; }
    .btn-primary { font-size: 14px; font-weight: 600; fill: white; }
    .btn-secondary { font-size: 13px; fill: #6B7280; }
    .link { font-size: 13px; fill: #6B7280; }
    .link-accent { fill: #3B82F6; font-weight: 500; }
  </style>

  <rect width="1200" height="960" fill="#F3F4F6"/>
  <rect width="1200" height="64" fill="url(#hg)"/>
  <text x="40" y="42" font-size="20" font-weight="700" fill="white">🃏 CardTrade Market</text>
  <circle cx="1100" cy="32" r="16" fill="rgba(255,255,255,0.2)"/>
  <text x="1095" y="38" font-size="14" fill="white">🛒(2)</text>
  <circle cx="1150" cy="32" r="16" fill="rgba(255,255,255,0.2)"/>
  <text x="1145" y="38" font-size="14" fill="white">🔔(3)</text>

  <text x="60" y="110" class="title">DASHBOARD</text>
  <text x="60" y="135" class="subtitle">Bienvenido, CardMaster MX</text>

  <!-- Stats Cards -->
  <g transform="translate(60, 160)">
    <rect width="260" height="150" rx="16" fill="white" filter="url(#sh)"/>
    <text x="130" y="180" text-anchor="middle" class="stat-value" fill="#10B981">$1,240</text>
    <text x="130" y="210" text-anchor="middle" class="stat-label">Ventas este mes</text>
    <text x="130" y="230" text-anchor="middle" class="stat-delta" fill="#10B981">📈 +23% vs mes anterior</text>
  </g>

  <g transform="translate(340, 160)">
    <rect width="260" height="150" rx="16" fill="white" filter="url(#sh)"/>
    <text x="130" y="180" text-anchor="middle" class="stat-value" fill="#3B82F6">8</text>
    <text x="130" y="210" text-anchor="middle" class="stat-label">Publicaciones activas</text>
    <text x="130" y="230" text-anchor="middle" class="stat-delta" fill="#6B7280">3 borradores pendientes</text>
  </g>

  <g transform="translate(620, 160)">
    <rect width="260" height="150" rx="16" fill="white" filter="url(#sh)"/>
    <text x="130" y="180" text-anchor="middle" class="stat-value" fill="#F59E0B">3</text>

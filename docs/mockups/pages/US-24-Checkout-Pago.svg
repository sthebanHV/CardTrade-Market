<svg viewBox="0 0 1200 1050" xmlns="http://www.w3.org/2000/svg">
  <title>Checkout - Paso 2: Pago</title>
  <desc>Paso 2 del checkout con progreso, resumen del pedido y metodo de pago</desc>
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cardShadow"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .header-text{font-size:20px;font-weight:700;fill:white}
    .page-title{font-size:24px;font-weight:700;fill:#111827}
    .section-title{font-size:18px;font-weight:700;fill:#111827}
    .card-title{font-size:16px;font-weight:600;fill:#111827}
    .card-meta{font-size:13px;fill:#6B7280}
    .summary-label{font-size:15px;fill:#6B7280}
    .summary-value{font-size:15px;font-weight:600;fill:#111827}
    .shipping{font-size:15px;font-weight:600;fill:#10B981}
    .total-label{font-size:20px;font-weight:700;fill:#111827}
    .total-value{font-size:26px;font-weight:700;fill:#3B82F6}
    .btn-primary{font-size:16px;font-weight:600;fill:white}
    .payment-title{font-size:18px;font-weight:700;fill:#111827}
    .payment-method{font-size:15px;font-weight:600;fill:#1E40AF}
    .payment-detail{font-size:13px;fill:#3B82F6}
    .payment-other{font-size:15px;fill:#374151}
    .payment-detail-other{font-size:13px;fill:#6B7280}
    .step-complete{font-size:14px;font-weight:600;fill:white}
    .step-current{font-size:14px;font-weight:600;fill:#3B82F6}
    .step-pending{font-size:14px;fill:#9CA3AF}
    .footer-text{font-size:12px;fill:#9CA3AF}
    .footer-link{font-size:12px;fill:#6B7280}
  </style>
  <rect width="1200" height="1050" fill="#F3F4F6"/>

  <g id="header">
    <rect width="1200" height="64" fill="url(#headerGrad)"/>
    <text x="40" y="42" class="header-text">&#x1F0CF; CardTrade Market</text>
  </g>

  <g id="main-content">
    <!-- Progress Bar -->
    <rect x="60" y="96" width="1080" height="50" rx="25" fill="#E5E7EB"/>
    <rect x="60" y="96" width="360" height="50" rx="25" fill="#3B82F6"/>
    <text x="240" y="127" text-anchor="middle" class="step-complete">1. Direccion &#x2713;</text>
    <text x="600" y="127" text-anchor="middle" class="step-current">2. Pago</text>
    <text x="960" y="127" text-anchor="middle" class="step-pending">3. Confirmar</text>

    <text x="60" y="195" class="page-title">CHECKOUT - PASO 2: PAGO</text>

    <!-- ===== LEFT: Order Details ===== -->
    <rect x="60" y="220" width="570" height="680" rx="12" fill="white" filter="url(#cardShadow)"/>
    <text x="100" y="270" class="section-title">DETALLES DEL PEDIDO</text>
    <line x1="100" y1="290" x2="590" y2="290" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Item 1 -->
    <rect x="100" y="315" width="90" height="90" rx="10" fill="#FEF3C7"/>
    <text x="145" y="370" text-anchor="middle" font-size="36">&#x1F0CF;</text>
    <text x="215" y="345" class="card-title">Charizard ex 199/165</text>
    <text x="215" y="370" class="card-meta">Obsidian Flames &#x2022; Ultra Rare</text>
    <text x="215" y="395" class="card-meta">Vendedor: CardMaster MX</text>
    <text x="570" y="345" text-anchor="end" class="summary-value">$45.00 x 1</text>

    <line x1="100" y1="430" x2="590" y2="430" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Item 2 -->
    <rect x="100" y="455" width="90" height="90" rx="10" fill="#DBEAFE"/>
    <text x="145" y="510" text-anchor="middle" font-size="36">&#x1F0CF;</text>
    <text x="215" y="485" class="card-title">Pikachu VMAX 188/185</text>
    <text x="215" y="510" class="card-meta">Vivid Voltage &#x2022; VMAX</text>
    <text x="215" y="535" class="card-meta">Vendedor: PikaFan99</text>
    <text x="570" y="485" text-anchor="end" class="summary-value">$28.00 x 1</text>

    <line x1="100" y1="570" x2="590" y2="570" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Shipping Address -->
    <text x="100" y="610" class="section-title" style="font-size:16px">DIRECCION DE ENVIO</text>
    <rect x="100" y="630" width="490" height="80" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
    <text x="120" y="658" class="card-meta" style="font-size:14px;fill:#111827;font-weight:600">Carlos Martinez</text>
    <text x="120" y="680" class="card-meta">Av. Insurgentes Sur 1234, Col. Del Valle</text>
    <text x="120" y="700" class="card-meta">Ciudad de Mexico, CDMX 03100</text>

    <rect x="100" y="735" width="200" height="40" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="200" y="761" text-anchor="middle" class="summary-label" style="font-size:13px">Cambiar direccion</text>

    <!-- ===== RIGHT: Summary + Payment ===== -->
    <rect x="660" y="220" width="480" height="680" rx="12" fill="white" filter="url(#cardShadow)"/>
    <text x="700" y="270" class="section-title">RESUMEN</text>
    <line x1="700" y1="290" x2="1100" y2="290" stroke="#E5E7EB" stroke-width="1"/>

    <text x="700" y="330" class="summary-label">Subtotal</text>
    <text x="1100" y="330" text-anchor="end" class="summary-value">$73.00</text>

    <text x="700" y="370" class="summary-label">Envio</text>
    <text x="1100" y="370" text-anchor="end" class="shipping">Gratis</text>

    <text x="700" y="410" class="summary-label">Comision (5%)</text>
    <text x="1100" y="410" text-anchor="end" class="summary-value">$3.65</text>

    <line x1="700" y1="440" x2="1100" y2="440" stroke="#E5E7EB" stroke-width="2"/>

    <text x="700" y="485" class="total-label">TOTAL</text>
    <text x="1100" y="485" text-anchor="end" class="total-value">$76.65</text>

    <line x1="700" y1="520" x2="1100" y2="520" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Payment Methods -->
    <text x="700" y="565" class="payment-title">METODO DE PAGO</text>

    <!-- Card selected -->
    <rect x="700" y="585" width="400" height="65" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
    <circle cx="735" cy="617" r="12" fill="#3B82F6"/>
    <circle cx="735" cy="617" r="5" fill="white"/>
    <text x="765" y="610" class="payment-method">Tarjeta de Credito/Debito</text>
    <text x="765" y="633" class="payment-detail">&#x2022;&#x2022;&#x2022;&#x2022; 4242 (Visa) &#x2022; Expira 12/27</text>

    <!-- PayPal -->
    <rect x="700" y="665" width="400" height="65" rx="10" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <circle cx="735" cy="697" r="12" fill="white" stroke="#D1D5DB" stroke-width="2"/>
    <text x="765" y="690" class="payment-other">PayPal</text>
    <text x="765" y="713" class="payment-detail-other">usuario@email.com</text>

    <!-- Mercado Pago -->
    <rect x="700" y="745" width="400" height="65" rx="10" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <circle cx="735" cy="777" r="12" fill="white" stroke="#D1D5DB" stroke-width="2"/>
    <text x="765" y="770" class="payment-other">Mercado Pago</text>
    <text x="765" y="793" class="payment-detail-other">Saldo disponible: $150.00 MXN</text>

    <!-- Confirm button -->
    <rect x="700" y="840" width="400" height="52" rx="8" fill="#3B82F6"/>
    <text x="900" y="873" text-anchor="middle" class="btn-primary">CONFIRMAR Y PAGAR $76.65</text>
  </g>

  <g id="footer">
    <rect x="0" y="970" width="1200" height="80" fill="#1F2937"/>
    <text x="600" y="1005" text-anchor="middle" class="footer-text">&#xA9; 2026 CardTrade Market. Todos los derechos reservados.</text>
    <text x="600" y="1025" text-anchor="middle" class="footer-link">Terminos | Privacidad | Contacto | Ayuda</text>
  </g>
</svg>
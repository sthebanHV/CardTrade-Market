<svg viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg">
  <title>Checkout - Paso 2: Pago</title>
  <desc>Paso 2 del checkout con progreso, resumen, direccion y metodo de pago</desc>
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cardShadow"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .header-text{font-size:20px;font-weight:700;fill:white}
    .page-title{font-size:22px;font-weight:700;fill:#111827}
    .section-title{font-size:17px;font-weight:700;fill:#111827}
    .card-title{font-size:15px;font-weight:600;fill:#111827}
    .card-meta{font-size:12px;fill:#6B7280}
    .summary-label{font-size:14px;fill:#6B7280}
    .summary-value{font-size:14px;font-weight:600;fill:#111827}
    .shipping-free{font-size:14px;font-weight:600;fill:#10B981}
    .total-label{font-size:18px;font-weight:700;fill:#111827}
    .total-value{font-size:24px;font-weight:700;fill:#3B82F6}
    .btn-primary{font-size:15px;font-weight:600;fill:white}
    .payment-title{font-size:16px;font-weight:700;fill:#111827}
    .pay-method{font-size:14px;font-weight:600;fill:#1E40AF}
    .pay-detail{font-size:12px;fill:#3B82F6}
    .pay-other{font-size:14px;fill:#374151}
    .pay-detail2{font-size:12px;fill:#6B7280}
    .step-done{font-size:13px;font-weight:600;fill:white}
    .step-now{font-size:13px;font-weight:600;fill:#3B82F6}
    .step-wait{font-size:13px;fill:#9CA3AF}
    .addr-name{font-size:14px;font-weight:600;fill:#111827}
    .addr-line{font-size:12px;fill:#6B7280}
    .btn-outline{font-size:13px;fill:#6B7280}
    .footer-text{font-size:12px;fill:#9CA3AF}
    .footer-link{font-size:12px;fill:#6B7280}
  </style>
  <rect width="1200" height="1000" fill="#F3F4F6"/>

  <g id="header">
    <rect width="1200" height="64" fill="url(#headerGrad)"/>
    <text x="40" y="42" class="header-text">&#x1F0CF; CardTrade Market</text>
  </g>

  <g id="main-content">
    <!-- Progress -->
    <rect x="60" y="90" width="1080" height="48" rx="24" fill="#E5E7EB"/>
    <rect x="60" y="90" width="360" height="48" rx="24" fill="#3B82F6"/>
    <text x="240" y="119" text-anchor="middle" class="step-done">1. Direccion &#x2713;</text>
    <text x="600" y="119" text-anchor="middle" class="step-now">2. Pago</text>
    <text x="960" y="119" text-anchor="middle" class="step-wait">3. Confirmar</text>

    <text x="60" y="180" class="page-title">CHECKOUT - PASO 2: PAGO</text>

    <!-- ===== LEFT COLUMN ===== -->
    <rect x="60" y="200" width="570" height="700" rx="12" fill="white" filter="url(#cardShadow)"/>
    <text x="95" y="245" class="section-title">DETALLES DEL PEDIDO</text>
    <line x1="95" y1="262" x2="595" y2="262" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Item 1 -->
    <rect x="95" y="285" width="85" height="85" rx="10" fill="#FEF3C7"/>
    <text x="137" y="338" text-anchor="middle" font-size="34">&#x1F0CF;</text>
    <text x="205" y="312" class="card-title">Charizard ex 199/165</text>
    <text x="205" y="335" class="card-meta">Obsidian Flames &#x2022; Ultra Rare</text>
    <text x="205" y="358" class="card-meta">Vendedor: CardMaster MX</text>
    <text x="575" y="312" text-anchor="end" class="summary-value">$45.00 x 1</text>

    <line x1="95" y1="395" x2="595" y2="395" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Item 2 -->
    <rect x="95" y="415" width="85" height="85" rx="10" fill="#DBEAFE"/>
    <text x="137" y="468" text-anchor="middle" font-size="34">&#x1F0CF;</text>
    <text x="205" y="442" class="card-title">Pikachu VMAX 188/185</text>
    <text x="205" y="465" class="card-meta">Vivid Voltage &#x2022; VMAX</text>
    <text x="205" y="488" class="card-meta">Vendedor: PikaFan99</text>
    <text x="575" y="442" text-anchor="end" class="summary-value">$28.00 x 1</text>

    <line x1="95" y1="525" x2="595" y2="525" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Shipping Address -->
    <text x="95" y="565" class="section-title">DIRECCION DE ENVIO</text>
    <rect x="95" y="585" width="500" height="90" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
    <text x="118" y="615" class="addr-name">Carlos Martinez</text>
    <text x="118" y="640" class="addr-line">Av. Insurgentes Sur 1234, Col. Del Valle</text>
    <text x="118" y="662" class="addr-line">Ciudad de Mexico, CDMX 03100 &#x2022; Tel: 55 1234 5678</text>

    <rect x="95" y="700" width="180" height="40" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="185" y="726" text-anchor="middle" class="btn-outline">Cambiar direccion</text>

    <!-- Delivery estimate -->
    <rect x="95" y="770" width="500" height="70" rx="8" fill="#EFF6FF"/>
    <text x="118" y="800" class="pay-method">&#x1F4E6; Envio Estafeta</text>
    <text x="118" y="825" class="pay-detail">Entrega estimada: 3-5 dias habiles &#x2022; Gratis</text>

    <!-- ===== RIGHT COLUMN ===== -->
    <rect x="660" y="200" width="480" height="700" rx="12" fill="white" filter="url(#cardShadow)"/>
    <text x="695" y="245" class="section-title">RESUMEN</text>
    <line x1="695" y1="262" x2="1105" y2="262" stroke="#E5E7EB" stroke-width="1"/>

    <text x="695" y="300" class="summary-label">Subtotal</text>
    <text x="1105" y="300" text-anchor="end" class="summary-value">$73.00</text>

    <text x="695" y="335" class="summary-label">Envio</text>
    <text x="1105" y="335" text-anchor="end" class="shipping-free">Gratis</text>

    <text x="695" y="370" class="summary-label">Comision plataforma (5%)</text>
    <text x="1105" y="370" text-anchor="end" class="summary-value">$3.65</text>

    <line x1="695" y1="395" x2="1105" y2="395" stroke="#E5E7EB" stroke-width="2"/>

    <text x="695" y="438" class="total-label">TOTAL</text>
    <text x="1105" y="438" text-anchor="end" class="total-value">$76.65</text>

    <line x1="695" y1="465" x2="1105" y2="465" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Payment Methods -->
    <text x="695" y="510" class="payment-title">METODO DE PAGO</text>

    <!-- Card selected -->
    <rect x="695" y="530" width="410" height="62" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
    <circle cx="730" cy="561" r="11" fill="#3B82F6"/>
    <circle cx="730" cy="561" r="5" fill="white"/>
    <text x="758" y="555" class="pay-method">Tarjeta de Credito/Debito</text>
    <text x="758" y="577" class="pay-detail">&#x2022;&#x2022;&#x2022;&#x2022; 4242 (Visa) &#x2022; Vence 12/27</text>

    <!-- PayPal -->
    <rect x="695" y="608" width="410" height="62" rx="10" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <circle cx="730" cy="639" r="11" fill="white" stroke="#D1D5DB" stroke-width="2"/>
    <text x="758" y="633" class="pay-other">PayPal</text>
    <text x="758" y="655" class="pay-detail2">usuario@email.com</text>

    <!-- Mercado Pago -->
    <rect x="695" y="686" width="410" height="62" rx="10" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <circle cx="730" cy="717" r="11" fill="white" stroke="#D1D5DB" stroke-width="2"/>
    <text x="758" y="711" class="pay-other">Mercado Pago</text>
    <text x="758" y="733" class="pay-detail2">Saldo disponible: $150.00 MXN</text>

    <!-- Security note -->
    <text x="900" y="778" text-anchor="middle" class="pay-detail2">&#x1F512; Pago seguro con encriptacion SSL</text>

    <!-- Confirm button -->
    <rect x="695" y="800" width="410" height="54" rx="8" fill="#3B82F6"/>
    <text x="900" y="834" text-anchor="middle" class="btn-primary">CONFIRMAR Y PAGAR $76.65</text>

    <text x="900" y="880" text-anchor="middle" class="pay-detail2">Al confirmar aceptas los Terminos y Condiciones</text>
  </g>

  <g id="footer">
    <rect x="0" y="930" width="1200" height="70" fill="#1F2937"/>
    <text x="600" y="960" text-anchor="middle" class="footer-text">&#xA9; 2026 CardTrade Market. Todos los derechos reservados.</text>
    <text x="600" y="980" text-anchor="middle" class="footer-link">Terminos | Privacidad | Contacto | Ayuda</text>
  </g>
</svg>
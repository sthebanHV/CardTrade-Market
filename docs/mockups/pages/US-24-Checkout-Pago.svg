<svg viewBox="0 0 1200 1100" xmlns="http://www.w3.org/2000/svg">
  <title>Checkout - Pago</title>
  <desc>Paso 2 del checkout con metodo de pago y resumen del pedido</desc>
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cardShadow"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .header-text{font-size:20px;font-weight:700;fill:white}
    .page-title{font-size:24px;font-weight:700;fill:#111827}
    .section-title{font-size:18px;font-weight:700;fill:#111827}
    .card-title{font-size:16px;font-weight:600;fill:#111827}
    .card-meta{font-size:12px;fill:#6B7280}
    .price{font-size:14px;font-weight:700;fill:#3B82F6}
    .shipping{font-size:14px;fill:#3B82F6}
    .commission{font-size:14px;fill:#6B7280}
    .total{font-size:24px;font-weight:700;fill:#3B82F6}
    .btn-primary{font-size:15px;font-weight:600;fill:white}
    .payment-title{font-size:16px;font-weight:700;fill:#111827}
    .payment-method{font-size:14px;font-weight:600;fill:#1E40AF}
    .payment-detail{font-size:12px;fill:#3B82F6}
    .payment-other{font-size:14px;fill:#374151}
    .payment-detail-other{font-size:12px;fill:#6B7280}
    .step-complete{font-size:13px;font-weight:600;fill:white}
    .step-current{font-size:13px;font-weight:600;fill:#3B82F6}
    .step-pending{font-size:13px;fill:#9CA3AF}
    .summary-label{font-size:14px;fill:#6B7280}
    .summary-value{font-size:14px;font-weight:600;fill:#111827}
    .footer-text{font-size:12px;fill:#9CA3AF}
    .footer-link{font-size:12px;fill:#6B7280}
  </style>
  <rect width="1200" height="1100" fill="#F3F4F6"/>
  <g id="header">
    <rect width="1200" height="64" fill="url(#headerGrad)"/>
    <text x="40" y="42" class="header-text">&#x1F0CF; CardTrade Market</text>
  </g>
  <g id="main-content">
    <!-- Progress Steps -->
    <rect x="60" y="96" width="1080" height="50" rx="25" fill="#E5E7EB"/>
    <rect x="60" y="96" width="360" height="50" rx="25" fill="#3B82F6"/>
    <text x="240" y="127" text-anchor="middle" class="step-complete">1. Direccion &#x2713;</text>
    <text x="600" y="127" text-anchor="middle" class="step-current">2. Pago</text>
    <text x="960" y="127" text-anchor="middle" class="step-pending">3. Confirmar</text>
    <text x="60" y="190" class="page-title">CHECKOUT - PASO 2: PAGO</text>
    <!-- Order Details Left -->
    <rect x="60" y="220" width="580" height="600" rx="12" fill="white" filter="url(#cardShadow)"/>
    <text x="100" y="270" class="section-title">DETALLES DEL PEDIDO</text>
    <!-- Item 1 -->
    <rect x="100" y="295" width="80" height="80" rx="8" fill="#FEF3C7"/>
    <text x="140" y="345" text-anchor="middle" font-size="32">&#x1F0CF;</text>
    <text x="200" y="320" class="card-title">Charizard ex</text>
    <text x="200" y="345" class="card-meta">$45.00 x 1</text>
    <text x="200" y="370" class="card-meta">Vendedor: CardMaster MX</text>
    <line x1="100" y1="395" x2="520" y2="395" stroke="#E5E7EB" stroke-width="1"/>
    <!-- Item 2 -->
    <rect x="100" y="415" width="80" height="80" rx="8" fill="#DBEAFE"/>
    <text x="140" y="465" text-anchor="middle" font-size="32">&#x1F0CF;</text>
    <text x="200" y="440" class="card-title">Pikachu VMAX</text>
    <text x="200" y="465" class="card-meta">$28.00 x 1</text>
    <text x="200" y="490" class="card-meta">Vendedor: PikaFan99</text>
    <!-- Summary Right -->
    <rect x="660" y="220" width="480" height="600" rx="12" fill="white" filter="url(#cardShadow)"/>
    <text x="700" y="270" class="section-title">RESUMEN</text>
    <line x1="700" y1="285" x2="1100" y2="285" stroke="#E5E7EB" stroke-width="1"/>
    <text x="700" y="315" class="summary-label">Subtotal</text>
    <text x="1080" y="315" text-anchor="end" class="price">$73.00</text>
    <text x="700" y="350" class="summary-label">Envio</text>
    <text x="1080" y="350" text-anchor="end" class="shipping">Gratis</text>
    <text x="700" y="385" class="summary-label">Comision (5%)</text>
    <text x="1080" y="385" text-anchor="end" class="commission">$3.65</text>
    <line x1="700" y1="410" x2="1100" y2="410" stroke="#E5E7EB" stroke-width="2"/>
    <text x="700" y="445" class="section-title">TOTAL</text>
    <text x="1080" y="445" text-anchor="end" class="total">$76.65</text>
    <!-- Payment Methods -->
    <text x="700" y="510" class="payment-title">METODO DE PAGO</text>
    <rect x="700" y="530" width="440" height="70" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <circle cx="740" cy="565" r="12" fill="#3B82F6"/>
    <circle cx="740" cy="565" r="6" fill="white"/>
    <text x="770" y="555" class="payment-method">Tarjeta de Credito/Debito</text>
    <text x="770" y="575" class="payment-detail">&#x2022;&#x2022;&#x2022;&#x2022; 4242 (Visa)</text>
    <rect x="700" y="615" width="440" height="70" rx="12" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <circle cx="740" cy="650" r="12" fill="white" stroke="#D1D5DB" stroke-width="2"/>
    <text x="770" y="640" class="payment-other">PayPal</text>
    <text x="770" y="660" class="payment-detail-other">usuario@email.com</text>
    <rect x="700" y="700" width="440" height="70" rx="12" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <circle cx="740" cy="735" r="12" fill="white" stroke="#D1D5DB" stroke-width="2"/>
    <text x="770" y="725" class="payment-other">Mercado Pago</text>
    <text x="770" y="745" class="payment-detail-other">Saldo disponible: $150.00</text>
    <rect x="700" y="800" width="440" height="48" rx="8" fill="#3B82F6"/>
    <text x="920" y="830" text-anchor="middle" class="btn-primary">CONFIRMAR Y PAGAR</text>
  </g>
  <g id="footer">
    <rect x="0" y="1020" width="1200" height="80" fill="#1F2937"/>
    <text x="600" y="1055" text-anchor="middle" class="footer-text">&#xA9; 2026 CardTrade Market. Todos los derechos reservados.</text>
    <text x="600" y="1075" text-anchor="middle" class="footer-link">Terminos | Privacidad | Contacto | Ayuda</text>
  </g>
</svg>
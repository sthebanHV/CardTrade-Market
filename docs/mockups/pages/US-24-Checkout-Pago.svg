<svg viewBox="0 0 1200 1020" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .title { font-size: 24px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 14px; fill: #6B7280; }
    .section-title { font-size: 18px; font-weight: 700; fill: #111827; }
    .card-title { font-size: 16px; font-weight: 600; fill: #111827; }
    .card-meta { font-size: 12px; fill: #6B7280; }
    .price { font-size: 14px; font-weight: 700; fill: #3B82F6; }
    .shipping { font-size: 14px; fill: #3B82F6; }
    .commission { font-size: 14px; fill: #6B7280; }
    .total { font-size: 24px; font-weight: 700; fill: #3B82F6; }
    .btn-primary { font-size: 15px; font-weight: 600; fill: white; }
    .payment-title { font-size: 16px; font-weight: 700; fill: #111827; }
    .payment-method { font-size: 14px; font-weight: 600; fill: #1E40AF; }
    .payment-detail { font-size: 12px; fill: #3B82F6; }
    .payment-other { font-size: 14px; fill: #374151; }
    .payment-detail-other { font-size: 12px; fill: #6B7280; }
    .btn-confirm { font-size: 15px; font-weight: 600; fill: white; }
    .step-complete { font-size: 13px; font-weight: 600; fill: white; }
    .step-current { font-size: 13px; font-weight: 600; fill: #3B82F6; }
    .step-pending { font-size: 13px; fill: #9CA3AF; }
  </style>

  <rect width="1200" height="1020" fill="#F3F4F6"/>
  <rect width="1200" height="64" fill="url(#hg)"/>
  <text x="40" y="42" font-size="20" font-weight="700" fill="white">🃏 CardTrade Market</text>

  <!-- Progress Steps -->
  <rect x="60" y="96" width="1080" height="50" rx="25" fill="#E5E7EB"/>
  <rect x="60" y="96" width="360" height="50" rx="25" fill="#3B82F6"/>
  <text x="240" y="127" text-anchor="middle" class="step-complete">1. Dirección ✓</text>
  <text x="600" y="127" text-anchor="middle" class="step-current">2. Pago</text>
  <text x="960" y="127" text-anchor="middle" class="step-pending">3. Confirmar</text>

  <text x="60" y="182" font-size="24" font-weight="700" fill="#111827">CHECKOUT - PASO 2: PAGO</text>

  <!-- Order Summary Left -->
  <rect x="60" y="210" width="580" height="740" rx="12" fill="white" filter="url(#sh)"/>
  <text x="100" y="255" class="section-title">DETALLES DEL PEDIDO</text>

  <g transform="translate(100, 280)">
    <rect width="100" height="100" rx="8" fill="#FEF3C7"/>
    <text x="50" y="60" text-anchor="middle" font-size="32">🃏</text>
    <text x="130" y="35" class="card-title">Charizard ex</text>
    <text x="130" y="55" class="card-meta">$45.00 × 1</text>
    <text x="130" y="75" class="card-meta">Vendedor: CardMaster MX</text>
  </g>

  <line x1="100" y1="410" x2="520" y2="410" stroke="#E5E7EB" stroke-width="1"/>

  <g transform="translate(100, 420)">
    <rect width="100" height="100" rx="8" fill="#DBEAFE"/>
    <text x="50" y="60" text-anchor="middle" font-size="32">🃏</text>
    <text x="130" y="35" class="card-title">Pikachu VMAX</text>
    <text x="130" y="55" class="card-meta">$28.00 × 1</text>
    <text x="130" y="75" class="card-meta">Vendedor: PikaFan99</text>
  </g>

  <!-- Summary Right -->
  <rect x="660" y="210" width="480" height="740" rx="12" fill="white" filter="url(#sh)"/>
  <text x="700" y="255" class="section-title">RESUMEN</text>

  <line x1="700" y1="270" x2="1100" y2="270" stroke="#E5E7EB" stroke-width="1"/>

  <text x="700" y="300" font-size="14" fill="#6B7280">Subtotal</text>
  <text x="1080" y="300" text-anchor="end" class="price">$73.00</text>

  <text x="700" y="335" font-size="14" fill="#6B7280">Envío</text>
  <text x="1080" y="335" text-anchor="end" class="shipping">Gratis</text>

  <text x="700" y="370" font-size="14" fill="#6B7280">Comisión (5%)</text>
  <text x="1080" y="370" text-anchor="end" class="commission">$3.65</text>

  <line x1="700" y1="395" x2="1100" y2="395" stroke="#E5E7EB" stroke-width="2"/>

  <text x="700" y="425" font-size="18" font-weight="700" fill="#111827">TOTAL</text>
  <text x="1080" y="425" text-anchor="end" class="total">$76.65</text>

  <!-- Payment Methods -->
  <text x="700" y="480" class="payment-title">MÉTODO DE PAGO</text>

  <rect x="700" y="500" width="440" height="70" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <circle cx="740" cy="535" r="12" fill="#3B82F6"/>
  <circle cx="740" cy="535" r="6" fill="white"/>
  <text x="770" y="525" class="payment-method">Tarjeta de Crédito/Débito</text>
  <text x="770" y="545" class="payment-detail">•••• 4242 (Visa)</text>

  <rect x="700" y="585" width="440" height="70" rx="12" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <circle cx="740" cy="620" r="12" fill="white" stroke="#D1D5DB" stroke-width="2"/>
  <text x="770" y="610" class="payment-other">PayPal</text>
  <text x="770" y="630" class="payment-detail-other">usuario@email.com</text>

  <rect x="700" y="670" width="440" height="70" rx="12" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <circle cx="740" cy="705" r="12" fill="white" stroke="#D1D5DB" stroke-width="2"/>
  <text x="770" y="695" class="payment-other">Mercado Pago</text>
  <text x="770" y="715" class="payment-detail-other">Saldo disponible: $150.00</text>

  <rect x="700" y="755" width="440" height="48" rx="8" fill="#3B82F6"/>
  <text x="920" y="785" text-anchor="middle" class="btn-primary">CONFIRMAR Y PAGAR</text>
</svg>
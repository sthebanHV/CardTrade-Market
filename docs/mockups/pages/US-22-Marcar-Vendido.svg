<svg viewBox="0 0 1200 850" xmlns="http://www.w3.org/2000/svg">
  <title>Marcar como Vendida</title>
  <desc>Modal para confirmar venta de carta con envio y transportista</desc>
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cardShadow"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .header-text{font-size:20px;font-weight:700;fill:white}
    .page-title{font-size:24px;font-weight:700;fill:#111827}
    .modal-title{font-size:22px;font-weight:700;fill:#111827}
    .card-name{font-size:14px;fill:#6B7280}
    .warning{font-size:14px;font-weight:600;fill:#EF4444}
    .label{font-size:13px;font-weight:500;fill:#374151}
    .option-text{font-size:14px;fill:#065F46}
    .option-desc{font-size:12px;fill:#065F46}
    .select-text{font-size:13px;fill:#111827}
    .btn-confirm{font-size:15px;font-weight:600;fill:white}
    .btn-cancel{font-size:14px;fill:#6B7280}
    .footer-text{font-size:12px;fill:#9CA3AF}
    .footer-link{font-size:12px;fill:#6B7280}
  </style>
  <rect width="1200" height="850" fill="#F3F4F6"/>

  <g id="header">
    <rect width="1200" height="64" fill="url(#headerGrad)"/>
    <text x="40" y="42" class="header-text">&#x1F0CF; CardTrade Market</text>
  </g>

  <g id="main-content">
    <text x="60" y="115" class="page-title">MARCAR COMO VENDIDA</text>

    <!-- Card preview -->
    <rect x="60" y="140" width="1080" height="120" rx="12" fill="white" filter="url(#cardShadow)"/>
    <rect x="85" y="160" width="80" height="80" rx="10" fill="#FEF3C7"/>
    <text x="125" y="210" text-anchor="middle" font-size="36">&#x1F0CF;</text>
    <text x="190" y="185" class="card-name" style="font-size:16px;font-weight:600;fill:#111827">Charizard ex 199/165</text>
    <text x="190" y="210" class="card-name">Pokemon &#x2022; Obsidian Flames &#x2022; Ultra Rare</text>
    <text x="190" y="235" class="card-name">Precio: $45.00 MXN</text>

    <!-- Modal -->
    <rect x="250" y="300" width="700" height="400" rx="16" fill="white" filter="url(#cardShadow)"/>
    <text x="600" y="350" text-anchor="middle" class="modal-title">CONFIRMAR VENTA</text>

    <text x="600" y="385" text-anchor="middle" class="warning">&#x26A0;&#xFE0F; Esta accion no se puede deshacer</text>

    <text x="300" y="425" class="label">Ya enviaste la carta al comprador?</text>
    <rect x="300" y="435" width="600" height="50" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="600" y="465" text-anchor="middle" class="option-text">&#x2705; Si, ya envie la carta (tracking: MX123456789)</text>

    <text x="300" y="510" class="label">Selecciona transportista:</text>
    <rect x="300" y="520" width="600" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="320" y="548" class="select-text">Estafeta &#x25BC;</text>
  </g>

  <g id="footer">
    <rect x="0" y="770" width="1200" height="80" fill="#1F2937"/>
    <text x="600" y="805" text-anchor="middle" class="footer-text">&#xA9; 2026 CardTrade Market. Todos los derechos reservados.</text>
    <text x="600" y="825" text-anchor="middle" class="footer-link">Terminos | Privacidad | Contacto | Ayuda</text>
  </g>
</svg>

<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>text { font-family: 'Inter', sans-serif; }</style>
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E40AF"/><stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1200" height="900" fill="#F3F4F6"/>
  <rect width="1200" height="64" fill="url(#hg)"/>
  <text x="40" y="40" fill="white" font-size="20" font-weight="700">🃏 CardTrade Market</text>

  <rect x="350" y="200" width="500" height="420" rx="12" fill="white" filter="url(#sh)"/>
  <text x="600" y="255" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">RECUPERAR CONTRASEÑA</text>
  <text x="600" y="280" text-anchor="middle" font-size="14" fill="#6B7280">Te enviaremos un enlace para restablecer</text>

  <text x="400" y="325" font-size="13" font-weight="500" fill="#374151">Correo Electrónico</text>
  <rect x="400" y="335" width="400" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="420" y="363" fill="#9CA3AF" font-size="14">📧 usuario@correo.com</text>

  <rect x="400" y="400" width="400" height="48" rx="8" fill="#3B82F6"/>
  <text x="600" y="430" text-anchor="middle" fill="white" font-size="15" font-weight="600">ENVIAR ENLACE</text>

  <text x="600" y="480" text-anchor="middle" font-size="14" fill="#6B7280">¿Recordaste tu contraseña? <tspan fill="#3B82F6" font-weight="500">Iniciar sesión</tspan></text>

  <rect x="400" y="510" width="400" height="80" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="420" y="538" font-size="13" fill="#1E40AF">💡 No recibiste el correo?</text>
  <text x="420" y="558" font-size="12" fill="#3B82F6">Revisa tu carpeta de spam o solicita otro enlace</text>
</svg>
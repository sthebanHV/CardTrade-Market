<svg viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg">
  <title>Gestionar Coleccion</title>
  <desc>Grid de coleccion personal con cartas y filtros</desc>
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cardShadow"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .header-text{font-size:20px;font-weight:700;fill:white}
    .page-title{font-size:24px;font-weight:700;fill:#111827}
    .subtitle{font-size:14px;fill:#6B7280}
    .section-title{font-size:14px;font-weight:700;fill:#111827}
    .card-title{font-size:13px;font-weight:600;fill:#111827}
    .card-meta{font-size:11px;fill:#6B7280}
    .card-price{font-size:13px;font-weight:600;fill:#3B82F6}
    .card-delta{font-size:11px;font-weight:600}
    .filter-active{font-size:11px;font-weight:600;fill:white}
    .filter-inactive{font-size:12px;fill:#6B7280}
    .btn-primary{font-size:13px;font-weight:600;fill:white}
    .add-card{font-size:13px;fill:#6B7280}
    .footer-text{font-size:12px;fill:#9CA3AF}
    .footer-link{font-size:12px;fill:#6B7280}
  </style>
  <rect width="1200" height="1000" fill="#F3F4F6"/>
  <g id="header">
    <rect width="1200" height="64" fill="url(#headerGrad)"/>
    <text x="40" y="42" class="header-text">&#x1F0CF; CardTrade Market</text>
  </g>
  <g id="main-content">
    <text x="60" y="115" class="page-title">MI COLECCION</text>
    <text x="60" y="140" class="subtitle">127 cartas &#x2022; Valor estimado: $12,450 MXN</text>
    <rect x="60" y="160" width="1080" height="50" rx="8" fill="white" filter="url(#cardShadow)"/>
    <text x="80" y="190" class="section-title">Coleccion:</text>
    <rect x="170" y="168" width="200" height="34" rx="6" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="270" y="190" text-anchor="middle" font-size="13" fill="#111827">Mi Coleccion Principal &#x25BC;</text>
    <text x="400" y="190" class="filter-inactive">Pokemon Vintage &#x25BC;</text>
    <text x="550" y="190" class="filter-inactive">Magic Legacy &#x25BC;</text>
    <rect x="900" y="168" width="200" height="34" rx="6" fill="#3B82F6"/>
    <text x="1000" y="190" text-anchor="middle" class="btn-primary">+ Nueva Coleccion</text>
    <rect x="60" y="225" width="1080" height="45" rx="8" fill="white" filter="url(#cardShadow)"/>
    <rect x="80" y="233" width="150" height="28" rx="4" fill="#3B82F6"/>
    <text x="155" y="252" text-anchor="middle" class="filter-active">Todas (127)</text>
    <text x="280" y="252" class="filter-inactive">Pokemon (89)</text>
    <text x="380" y="252" class="filter-inactive">Magic (28)</text>
    <text x="480" y="252" class="filter-inactive">Yu-Gi-Oh! (10)</text>
    <text x="580" y="252" class="filter-inactive">Graded (15)</text>
    <text x="900" y="252" class="filter-inactive">Ordenar: Recientes &#x25BC;</text>
    <g transform="translate(60, 290)">
      <rect width="210" height="210" rx="12" fill="white" filter="url(#cardShadow)"/>
      <rect width="210" height="130" rx="12" fill="#FEF3C7"/>
      <text x="105" y="75" text-anchor="middle" font-size="40">&#x1F0CF;</text>
      <text x="18" y="155" class="card-title">Charizard ex</text>
      <text x="18" y="175" class="card-meta">Obsidian Flames &#x2022; UR</text>
      <text x="18" y="195" class="card-price">$45.00</text>
      <text x="180" y="195" class="card-delta" fill="#10B981">+12%</text>
    </g>
    <g transform="translate(290, 290)">
      <rect width="210" height="210" rx="12" fill="white" filter="url(#cardShadow)"/>
      <rect width="210" height="130" rx="12" fill="#DBEAFE"/>
      <text x="105" y="75" text-anchor="middle" font-size="40">&#x1F0CF;</text>
      <text x="18" y="155" class="card-title">Black Lotus</text>
      <text x="18" y="175" class="card-meta">Beta &#x2022; Rare</text>
      <text x="18" y="195" class="card-price">$8,500</text>
      <text x="180" y="195" class="card-delta" fill="#EF4444">-3%</text>
    </g>
    <g transform="translate(520, 290)">
      <rect width="210" height="210" rx="12" fill="white" filter="url(#cardShadow)"/>
      <rect width="210" height="130" rx="12" fill="#FEF3C7"/>
      <text x="105" y="75" text-anchor="middle" font-size="40">&#x1F0CF;</text>
      <text x="18" y="155" class="card-title">Pikachu VMAX</text>
      <text x="18" y="175" class="card-meta">Vivid Voltage &#x2022; VMAX</text>
      <text x="18" y="195" class="card-price">$28.00</text>
      <text x="180" y="195" class="card-delta" fill="#10B981">+5%</text>
    </g>
    <g transform="translate(750, 290)">
      <rect width="210" height="210" rx="12" fill="white" filter="url(#cardShadow)"/>
      <rect width="210" height="130" rx="12" fill="#FCE7F3"/>
      <text x="105" y="75" text-anchor="middle" font-size="40">&#x1F0CF;</text>
      <text x="18" y="155" class="card-title">Blue-Eyes White</text>
      <text x="18" y="175" class="card-meta">LOB &#x2022; Ultra Rare</text>
      <text x="18" y="195" class="card-price">$125.00</text>
    </g>
    <g transform="translate(980, 290)">
      <rect width="110" height="210" rx="12" fill="white" filter="url(#cardShadow)" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="8,4"/>
      <text x="55" y="115" text-anchor="middle" font-size="40">+</text>
      <text x="55" y="145" text-anchor="middle" class="add-card">Agregar carta</text>
    </g>
    <g transform="translate(60, 525)">
      <rect width="210" height="210" rx="12" fill="white" filter="url(#cardShadow)"/>
      <rect width="210" height="130" rx="12" fill="#FEF3C7"/>
      <text x="105" y="75" text-anchor="middle" font-size="40">&#x1F0CF;</text>
      <text x="18" y="155" class="card-title">Mewtwo VSTAR</text>
      <text x="18" y="175" class="card-meta">Brilliant Stars &#x2022; VSTAR</text>
      <text x="18" y="195" class="card-price">$52.00</text>
      <text x="180" y="195" class="card-delta" fill="#10B981">+8%</text>
    </g>
    <g transform="translate(290, 525)">
      <rect width="210" height="210" rx="12" fill="white" filter="url(#cardShadow)"/>
      <rect width="210" height="130" rx="12" fill="#D1FAE5"/>
      <text x="105" y="75" text-anchor="middle" font-size="40">&#x1F0CF;</text>
      <text x="18" y="155" class="card-title">Charizard (Base)</text>
      <text x="18" y="175" class="card-meta">Base Set &#x2022; 1st Ed. &#x2022; PSA 9</text>
      <text x="18" y="195" class="card-price">$3,200</text>
      <text x="180" y="195" class="card-delta" fill="#10B981">+25%</text>
    </g>
  </g>
  <g id="footer">
    <rect x="0" y="920" width="1200" height="80" fill="#1F2937"/>
    <text x="600" y="955" text-anchor="middle" class="footer-text">&#xA9; 2026 CardTrade Market. Todos los derechos reservados.</text>
    <text x="600" y="975" text-anchor="middle" class="footer-link">Terminos | Privacidad | Contacto | Ayuda</text>
  </g>
</svg>
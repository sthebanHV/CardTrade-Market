<svg viewBox="0 0 1200 960" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .title { font-size: 24px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 14px; fill: #6B7280; }
    .section-title { font-size: 14px; font-weight: 700; fill: #111827; }
    .card-title { font-size: 13px; font-weight: 600; fill: #111827; }
    .card-meta { font-size: 11px; fill: #6B7280; }
    .card-price { font-size: 13px; font-weight: 600; fill: #3B82F6; }
    .card-delta { font-size: 11px; font-weight: 600; }
    .filter-active { font-size: 11px; font-weight: 600; fill: white; }
    .filter-inactive { font-size: 12px; fill: #6B7280; }
    .btn-primary { font-size: 13px; font-weight: 600; fill: white; }
    .add-card { font-size: 13px; fill: #6B7280; }
  </style>

  <rect width="1200" height="960" fill="#F3F4F6"/>
  <rect width="1200" height="64" fill="url(#hg)"/>
  <text x="40" y="42" font-size="20" font-weight="700" fill="white">🃏 CardTrade Market</text>

  <text x="60" y="110" font-size="24" font-weight="700" fill="#111827">MI COLECCIÓN</text>
  <text x="60" y="135" class="subtitle">127 cartas • Valor estimado: $12,450 MXN</text>

  <!-- Collection Selector -->
  <rect x="60" y="165" width="1080" height="56" rx="8" fill="white" filter="url(#sh)"/>
  <text x="80" y="198" class="section-title">Colección:</text>
  <rect x="170" y="175" width="200" height="36" rx="6" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="270" y="198" text-anchor="middle" font-size="13" fill="#111827">Mi Colección Principal ▼</text>
  <text x="400" y="198" class="filter-inactive">Pokémon Vintage ▼</text>
  <text x="550" y="198" class="filter-inactive">Magic Legacy ▼</text>
  <rect x="900" y="175" width="200" height="36" rx="6" fill="#3B82F6"/>
  <text x="1000" y="198" text-anchor="middle" class="btn-primary">+ Nueva Colección</text>

  <!-- Filters -->
  <rect x="60" y="240" width="1080" height="50" rx="8" fill="white" filter="url(#sh)"/>
  <rect x="80" y="248" width="160" height="28" rx="4" fill="#3B82F6"/>
  <text x="160" y="266" text-anchor="middle" class="filter-active">Todas (127)</text>
  <text x="280" y="266" class="filter-inactive">Pokémon (89)</text>
  <text x="380" y="266" class="filter-inactive">Magic (28)</text>
  <text x="480" y="266" class="filter-inactive">Yu-Gi-Oh! (10)</text>
  <text x="580" y="266" class="filter-inactive">Graded (15)</text>
  <text x="900" y="266" class="filter-inactive">Ordenar: Recientes ▼</text>

  <!-- Grid -->
  <g transform="translate(60, 310)">
    <rect width="220" height="220" rx="12" fill="white" filter="url(#sh)"/>
    <rect width="220" height="140" rx="12" fill="#FEF3C7"/>
    <text x="110" y="80" text-anchor="middle" font-size="40">🃏</text>
    <text x="20" y="165" class="card-title">Charizard ex</text>
    <text x="20" y="185" class="card-meta">Obsidian Flames • UR</text>
    <text x="20" y="200" class="card-price">$45.00</text>
    <text x="190" y="200" class="card-delta" fill="#10B981">📈 +12%</text>
  </g>

  <g transform="translate(300, 310)">
    <rect width="220" height="220" rx="12" fill="white" filter="url(#sh)"/>
    <rect width="220" height="140" rx="12" fill="#DBEAFE"/>
    <text x="110" y="80" text-anchor="middle" font-size="40">🃏</text>
    <text x="20" y="165" class="card-title">Black Lotus</text>
    <text x="20" y="185" class="card-meta">Beta • Rare</text>
    <text x="20" y="200" class="card-price">$8,500</text>
    <text x="190" y="200" class="card-delta" fill="#EF4444">📉 -3%</text>
  </g>

  <g transform="translate(540, 310)">
    <rect width="220" height="220" rx="12" fill="white" filter="url(#sh)"/>
    <rect width="220" height="140" rx="12" fill="#FEF3C7"/>
    <text x="110" y="80" text-anchor="middle" font-size="40">🃏</text>
    <text x="20" y="165" class="card-title">Pikachu VMAX</text>
    <text x="20" y="185" class="card-meta">Vivid Voltage • VMAX</text>
    <text x="20" y="200" class="card-price">$28.00</text>
    <text x="190" y="200" class="card-delta" fill="#10B981">📈 +5%</text>
  </g>

  <g transform="translate(780, 310)">
    <rect width="220" height="220" rx="12" fill="white" filter="url(#sh)"/>
    <rect width="220" height="140" rx="12" fill="#FCE7F3"/>
    <text x="110" y="80" text-anchor="middle" font-size="40">🃏</text>
    <text x="20" y="165" class="card-title">Blue-Eyes White</text>
    <text x="20" y="185" class="card-meta">LOB • Ultra Rare</text>
    <text x="20" y="200" class="card-price">$125.00</text>
    <text x="190" y="200" class="card-delta">→</text>
  </g>

  <g transform="translate(1020, 310)">
    <rect width="120" height="220" rx="12" fill="white" filter="url(#sh)" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="60" y="120" text-anchor="middle" font-size="40">+</text>
    <text x="60" y="150" text-anchor="middle" class="add-card">Agregar carta</text>
  </g>

  <!-- Second Row -->
  <g transform="translate(60, 550)">
    <rect width="220" height="220" rx="12" fill="white" filter="url(#sh)"/>
    <rect width="220" height="140" rx="12" fill="#FEF3C7"/>
    <text x="110" y="80" text-anchor="middle" font-size="40">🃏</text>
    <text x="20" y="165" class="card-title">Mewtwo VSTAR</text>
    <text x="20" y="185" class="card-meta">Brilliant Stars • VSTAR</text>
    <text x="20" y="200" class="card-price">$52.00</text>
    <text x="190" y="200" class="card-delta" fill="#10B981">📈 +8%</text>
  </g>

  <g transform="translate(300, 550)">
    <rect width="220" height="220" rx="12" fill="white" filter="url(#sh)"/>
    <rect width="220" height="140" rx="12" fill="#D1FAE5"/>
    <text x="110" y="80" text-anchor="middle" font-size="40">🃏</text>
    <text x="20" y="165" class="card-title">Charizard (Base)</text>
    <text x="20" y="185" class="card-meta">Base Set • 1st Ed. • PSA 9</text>
    <text x="20" y="200" class="card-price">$3,200</text>
    <text x="190" y="200" class="card-delta" fill="#10B981">📈 +25%</text>
  </g>
</svg>
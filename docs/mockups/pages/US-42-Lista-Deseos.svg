    <text x="140" y="75" font-size="12" fill="#6B7280">Precio objetivo: <tspan font-weight="600" fill="#EF4444">$250</tspan></text>
    <text x="140" y="95" font-size="12" fill="#6B7280">Nota: BGS 9.5 o PSA 10 preferible</text>

  <text x="40" y="40" fill="white" font-size="20" font-weight="700">🃏 CardTrade Market</text>

  <text x="60" y="110" font-size="24" font-weight="700" fill="#111827">MI LISTA DE DESEOS</text>
  <text x="60" y="135" font-size="14" fill="#6B7280">12 cartas que busco • Comparte para recibir ofertas</text>

  <!-- Share Button -->
  <rect x="900" y="70" width="200" height="44" rx="8" fill="#3B82F6"/>

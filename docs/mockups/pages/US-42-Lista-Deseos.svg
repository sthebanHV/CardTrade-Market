  <rect x="300" y="290" width="600" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="320" y="318" fill="#9CA3AF" font-size="14">Escribe el nombre (ej. Ancestral Recall)...</text>

  <text x="300" y="355" font-size="13" font-weight="500" fill="#374151">Categoría</text>
  <rect x="300" y="365" width="180" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="390" y="393" text-anchor="middle" fill="#111827" font-size="14">Comprar ▼</text>
  <text x="520" y="355" font-size="13" font-weight="500" fill="#374151">Prioridad</text>
  <rect x="520" y="365" width="180" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="610" y="393" text-anchor="middle" fill="#111827" font-size="14">Alta ▼</text>
  <text x="740" y="355" font-size="13" font-weight="500" fill="#374151">Precio Máx.</text>
  <rect x="740" y="365" width="160" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="820" y="393" fill="#9CA3AF" font-size="14">$500</text>


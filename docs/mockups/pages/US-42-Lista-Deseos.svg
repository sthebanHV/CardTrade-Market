  <rect x="300" y="440" width="600" height="80" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="320" y="470" fill="#9CA3AF" font-size="14">Busco para completar mi colección Power 9...</text>

  <rect x="300" y="540" width="240" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="420" y="568" text-anchor="middle" fill="#6B7280" font-size="14">Cancelar</text>
  <rect x="560" y="540" width="340" height="44" rx="8" fill="#3B82F6"/>
  <text x="730" y="568" text-anchor="middle" fill="white" font-size="14" font-weight="600">AGREGAR A DESEOS</text>

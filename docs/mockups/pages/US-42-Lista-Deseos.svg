    <rect x="900" y="15" width="100" height="36" rx="6" fill="#EFF6FF"/>
    <text x="950" y="38" text-anchor="middle" fill="#3B82F6" font-size="11" font-weight="600">Editar</text>
    <rect x="1010" y="15" width="36" height="36" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>

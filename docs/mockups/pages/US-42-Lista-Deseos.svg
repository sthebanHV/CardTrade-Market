    <text x="140" y="75" font-size="12" fill="#6B7280">Precio objetivo: <tspan font-weight="600" fill="#EF4444">$3,000</tspan></text>
    <text x="140" y="95" font-size="12" fill="#6B7280">Nota: Busco PSA 9 o superior. Sin whitening.</text>
    <rect x="800" y="15" width="80" height="30" rx="15" fill="#FEF3C7"/>
    <text x="840" y="33" text-anchor="middle" fill="#92400E" font-size="11" font-weight="600">ALTA</text>
    <rect x="900" y="15" width="100" height="36" rx="6" fill="#EFF6FF"/>
    <text x="950" y="38" text-anchor="middle" fill="#3B82F6" font-size="11" font-weight="600">Editar</text>
    <rect x="1010" y="15" width="36" height="36" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
    <text x="1028" y="38" text-anchor="middle" fill="#EF4444" font-size="14">🗑️</text>
  </g>


<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E40AF"/><stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1200" height="600" fill="#F3F4F6"/>
  <rect width="1200" height="64" fill="url(#hg)"/>
  <text x="40" y="40" fill="white" font-size="20" font-weight="700">🃏 CardTrade Market</text>

  <!-- Modal Overlay -->
  <rect width="1200" height="600" fill="rgba(17,24,39,0.5)"/>

  <!-- Modal -->
  <rect x="300" y="100" width="600" height="400" rx="16" fill="white"/>
  <text x="600" y="145" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">EXPORTAR COLECCIÓN</text>

  <text x="340" y="190" font-size="16" font-weight="700" fill="#111827">FORMATO</text>
  <rect x="340" y="205" width="520" height="56" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <circle cx="370" cy="233" r="12" fill="#3B82F6"/>
  <circle cx="370" cy="233" r="6" fill="white"/>
  <text x="400" y="230" font-size="14" font-weight="600" fill="#1E40AF">CSV (Excel/Google Sheets)</text>
  <text x="400" y="248" font-size="12" fill="#3B82F6">Columnas: Nombre, Juego, Set, Rareza, Estado, Precio, Fecha, Valor Actual</text>

  <rect x="340" y="275" width="520" height="56" rx="12" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <circle cx="370" cy="303" r="12" fill="white" stroke="#D1D5DB" stroke-width="2"/>
  <text x="400" y="300" font-size="14" fill="#374151">PDF (Reporte visual)</text>
  <text x="400" y="318" font-size="12" fill="#6B7280">Incluye imágenes, gráficas de valor y resumen estadístico</text>

  <rect x="340" y="345" width="520" height="56" rx="12" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <circle cx="370" cy="373" r="12" fill="white" stroke="#D1D5DB" stroke-width="2"/>
  <text x="400" y="370" font-size="14" fill="#374151">JSON (API/Desarrolladores)</text>
  <text x="400" y="388" font-size="12" fill="#6B7280">Estructura completa para integraciones</text>

  <line x1="340" y1="415" x2="860" y2="415" stroke="#E5E7EB" stroke-width="1"/>

  <text x="340" y="435" font-size="13" font-weight="500" fill="#374151">Incluir en la exportación:</text>
  <rect x="360" y="450" width="24" height="24" rx="4" fill="#3B82F6"/>
  <circle cx="372" cy="462" r="6" fill="white"/>
  <text x="395" y="468" font-size="13" fill="#374151">Solo cartas de mi colección principal</text>
  <rect x="680" y="450" width="24" height="24" rx="4" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="715" y="468" font-size="13" fill="#374151">Incluir valor histórico</text>
  <rect x="360" y="485" width="24" height="24" rx="4" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="395" y="503" font-size="13" fill="#374151">Incluir fotos (solo PDF)</text>

  <rect x="340" y="515" width="240" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="460" y="543" text-anchor="middle" fill="#6B7280" font-size="14">Cancelar</text>
  <rect x="600" y="515" width="260" height="44" rx="8" fill="#3B82F6"/>
  <text x="730" y="543" text-anchor="middle" fill="white" font-size="14" font-weight="600">EXPORTAR</text>
</svg>
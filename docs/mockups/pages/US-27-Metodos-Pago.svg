<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <title>Metodos de Pago</title>
  <desc>Gestion de metodos de pago guardados</desc>
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cardShadow"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .header-text{font-size:20px;font-weight:700;fill:white}
    .page-title{font-size:24px;font-weight:700;fill:#111827}
    .subtitle{font-size:14px;fill:#6B7280}
    .card-title{font-size:16px;font-weight:600;fill:#111827}
    .card-meta{font-size:13px;fill:#6B7280}
    .status-default{font-size:12px;font-weight:600;fill:#3B82F6}
    .status-verified{font-size:12px;font-weight:600;fill:#10B981}
    .status-available{font-size:12px;font-weight:600;fill:#F59E0B}
    .btn-edit{font-size:12px;fill:#6B7280}
    .btn-delete{font-size:12px;fill:#EF4444}
    .btn-reload{font-size:12px;fill:#6B7280}
    .footer-text{font-size:12px;fill:#9CA3AF}
    .footer-link{font-size:12px;fill:#6B7280}
  </style>
  <rect width="1200" height="900" fill="#F3F4F6"/>
  <g id="header">
    <rect width="1200" height="64" fill="url(#headerGrad)"/>
    <text x="40" y="42" class="header-text">&#x1F0CF; CardTrade Market</text>
  </g>
  <g id="main-content">
    <text x="60" y="115" class="page-title">METODOS DE PAGO</text>
    <text x="60" y="140" class="subtitle">Gestiona tus metodos de pago guardados</text>
    <rect x="60" y="165" width="1080" height="130" rx="12" fill="white" filter="url(#cardShadow)"/>
    <rect x="85" y="185" width="90" height="90" rx="12" fill="#EFF6FF"/>
    <text x="130" y="242" text-anchor="middle" font-size="36">&#x1F4B3;</text>
    <text x="200" y="215" class="card-title">Visa &#x2022;&#x2022;&#x2022;&#x2022; 4242</text>
    <text x="200" y="240" class="card-meta">Expira 12/27</text>
    <text x="200" y="262" class="status-default">Predeterminada</text>
    <rect x="920" y="190" width="180" height="34" rx="6" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="1010" y="212" text-anchor="middle" class="btn-edit">Editar</text>
    <rect x="920" y="240" width="180" height="34" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
    <text x="1010" y="262" text-anchor="middle" class="btn-delete">Eliminar</text>
    <rect x="60" y="315" width="1080" height="130" rx="12" fill="white" filter="url(#cardShadow)"/>
    <rect x="85" y="335" width="90" height="90" rx="12" fill="#ECFDF5"/>
    <text x="130" y="392" text-anchor="middle" font-size="36">&#x1F418;</text>
    <text x="200" y="365" class="card-title">PayPal</text>
    <text x="200" y="390" class="card-meta">usuario@email.com</text>
    <text x="200" y="412" class="status-verified">Verificada</text>
    <rect x="920" y="340" width="180" height="34" rx="6" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="1010" y="362" text-anchor="middle" class="btn-edit">Editar</text>
    <rect x="920" y="390" width="180" height="34" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
    <text x="1010" y="412" text-anchor="middle" class="btn-delete">Eliminar</text>
    <rect x="60" y="465" width="1080" height="130" rx="12" fill="white" filter="url(#cardShadow)"/>
    <rect x="85" y="485" width="90" height="90" rx="12" fill="#FEF3C7"/>
    <text x="130" y="542" text-anchor="middle" font-size="36">&#x1F3EA;</text>
    <text x="200" y="515" class="card-title">Mercado Pago</text>
    <text x="200" y="540" class="card-meta">Saldo: $150.00 MXN</text>
    <text x="200" y="562" class="status-available">Disponible</text>
    <rect x="920" y="490" width="180" height="34" rx="6" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="1010" y="512" text-anchor="middle" class="btn-reload">Recargar</text>
    <rect x="920" y="540" width="180" height="34" rx="6" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="1010" y="562" text-anchor="middle" class="btn-edit">Editar</text>
    <rect x="60" y="615" width="1080" height="100" rx="12" fill="white" filter="url(#cardShadow)" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="600" y="660" text-anchor="middle" font-size="16" fill="#6B7280">+ AGREGAR METODO DE PAGO</text>
    <text x="600" y="688" text-anchor="middle" font-size="13" fill="#9CA3AF">Tarjeta &#x2022; PayPal &#x2022; Mercado Pago</text>
  </g>
  <g id="footer">
    <rect x="0" y="820" width="1200" height="80" fill="#1F2937"/>
    <text x="600" y="855" text-anchor="middle" class="footer-text">&#xA9; 2026 CardTrade Market. Todos los derechos reservados.</text>
    <text x="600" y="875" text-anchor="middle" class="footer-link">Terminos | Privacidad | Contacto | Ayuda</text>
  </g>
</svg>
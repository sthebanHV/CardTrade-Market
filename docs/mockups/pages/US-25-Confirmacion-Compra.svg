<svg viewBox="0 0 1200 950" xmlns="http://www.w3.org/2000/svg">
  <title>Confirmacion de Compra</title>
  <desc>Pantalla de exito despues de completar una compra</desc>
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cardShadow"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .header-text{font-size:20px;font-weight:700;fill:white}
    .success-title{font-size:28px;font-weight:700;fill:#111827}
    .success-subtitle{font-size:16px;fill:#6B7280}
    .section-title{font-size:16px;font-weight:700;fill:#065F46}
    .detail-label{font-size:13px;fill:#6B7280}
    .detail-value{font-size:13px;fill:#111827}
    .detail-value-bold{font-size:16px;font-weight:700;fill:#10B981}
    .btn-primary{font-size:15px;font-weight:600;fill:white}
    .btn-secondary{font-size:14px;fill:#6B7280}
    .email-note{font-size:12px;fill:#6B7280}
    .footer-text{font-size:12px;fill:#9CA3AF}
    .footer-link{font-size:12px;fill:#6B7280}
  </style>
  <rect width="1200" height="950" fill="#F3F4F6"/>

  <g id="header">
    <rect width="1200" height="64" fill="url(#headerGrad)"/>
    <text x="40" y="42" class="header-text">&#x1F0CF; CardTrade Market</text>
  </g>

  <g id="main-content">
    <rect x="300" y="100" width="600" height="680" rx="16" fill="white" filter="url(#cardShadow)"/>

    <circle cx="600" cy="190" r="60" fill="#10B981"/>
    <text x="600" y="202" text-anchor="middle" fill="white" font-size="40">&#x2713;</text>

    <text x="600" y="290" text-anchor="middle" class="success-title">Compra Confirmada!</text>
    <text x="600" y="325" text-anchor="middle" class="success-subtitle">Tu pedido ha sido procesado exitosamente</text>

    <!-- Order Details -->
    <rect x="340" y="360" width="520" height="290" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="600" y="395" text-anchor="middle" class="section-title">DETALLES DEL PEDIDO</text>

    <text x="380" y="430" class="detail-label">Numero de pedido:</text>
    <text x="530" y="430" class="detail-value" style="font-weight:600">CT-2025-015234</text>

    <text x="380" y="460" class="detail-label">Fecha:</text>
    <text x="530" y="460" class="detail-value">15 Enero 2025, 14:32</text>

    <text x="380" y="490" class="detail-label">Metodo de pago:</text>
    <text x="530" y="490" class="detail-value">Visa &#x2022;&#x2022;&#x2022;&#x2022; 4242</text>

    <text x="380" y="520" class="detail-label">Total pagado:</text>
    <text x="530" y="520" class="detail-value-bold">$76.65 MXN</text>

    <line x1="380" y1="540" x2="820" y2="540" stroke="#A7F3D0" stroke-width="1"/>

    <text x="380" y="570" class="detail-label">Envio a:</text>
    <text x="380" y="590" class="detail-value">Carlos Martinez</text>
    <text x="380" y="610" class="detail-value">Av. Insurgentes Sur 1234</text>
    <text x="380" y="630" class="detail-value">Col. Del Valle, CDMX 03100</text>

    <text x="380" y="660" class="detail-label">Transportista:</text>
    <text x="530" y="660" class="detail-value">Estafeta &#x2022; Tracking: MX987654321</text>
  </g>

  <g id="footer">
    <rect x="0" y="870" width="1200" height="80" fill="#1F2937"/>
    <text x="600" y="905" text-anchor="middle" class="footer-text">&#xA9; 2026 CardTrade Market. Todos los derechos reservados.</text>
    <text x="600" y="925" text-anchor="middle" class="footer-link">Terminos | Privacidad | Contacto | Ayuda</text>
  </g>
</svg>

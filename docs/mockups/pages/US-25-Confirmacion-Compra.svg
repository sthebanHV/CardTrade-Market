<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E40AF"/><stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1200" height="900" fill="#F3F4F6"/>
  <rect width="1200" height="64" fill="url(#hg)"/>
  <text x="40" y="40" fill="white" font-size="20" font-weight="700">🃏 CardTrade Market</text>

  <!-- Success State -->
  <rect x="350" y="150" width="500" height="580" rx="16" fill="white" filter="url(#sh)"/>

  <circle cx="600" cy="220" r="60" fill="#10B981"/>
  <text x="600" y="232" text-anchor="middle" fill="white" font-size="40">✓</text>

  <text x="600" y="300" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">¡Compra Confirmada!</text>
  <text x="600" y="330" text-anchor="middle" font-size="16" fill="#6B7280">Tu pedido ha sido procesado exitosamente</text>

  <!-- Order Details -->
  <rect x="380" y="350" width="440" height="300" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="600" y="385" text-anchor="middle" font-size="16" font-weight="700" fill="#065F46">DETALLES DEL PEDIDO</text>

  <text x="420" y="415" font-size="13" fill="#6B7280">Número de pedido:</text>
  <text x="580" y="415" font-size="13" font-weight="600" fill="#111827">CT-2025-015234</text>

  <text x="420" y="440" font-size="13" fill="#6B7280">Fecha:</text>
  <text x="580" y="440" font-size="13" fill="#111827">15 Enero 2025, 14:32</text>

  <text x="420" y="465" font-size="13" fill="#6B7280">Método de pago:</text>
  <text x="580" y="465" font-size="13" fill="#111827">Visa •••• 4242</text>

  <text x="420" y="490" font-size="13" fill="#6B7280">Total pagado:</text>
  <text x="580" y="490" font-size="16" font-weight="700" fill="#10B981">$76.65 MXN</text>

  <line x1="420" y1="510" x2="780" y2="510" stroke="#A7F3D0" stroke-width="1"/>

  <text x="420" y="535" font-size="13" fill="#6B7280">Envío a:</text>
  <text x="420" y="555" font-size="13" fill="#111827">Carlos Martínez</text>
  <text x="420" y="572" font-size="13" fill="#111827">Av. Insurgentes Sur 1234</text>
  <text x="420" y="589" font-size="13" fill="#111827">Col. Del Valle, CDMX 03100</text>

  <text x="420" y="615" font-size="13" fill="#6B7280">Transportista:</text>
  <text x="580" y="615" font-size="13" fill="#111827">Estafeta • Tracking: MX987654321</text>

  <!-- Actions -->
  <rect x="400" y="660" width="400" height="48" rx="8" fill="#3B82F6"/>
  <text x="600" y="690" text-anchor="middle" fill="white" font-size="15" font-weight="600">VER PEDIDO</text>

  <rect x="400" y="720" width="400" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="600" y="750" text-anchor="middle" fill="#6B7280" font-size="14">SEGUIR COMPRANDO</text>

  <text x="600" y="790" text-anchor="middle" font-size="12" fill="#6B7280">Te enviamos la confirmación a tu email</text>
</svg>
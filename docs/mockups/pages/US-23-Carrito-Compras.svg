<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>text { font-family: 'Inter', sans-serif; }</style>
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E40AF"/><stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1200" height="900" fill="#F3F4F6"/>
  <rect width="1200" height="64" fill="url(#hg)"/>
  <text x="40" y="40" fill="white" font-size="20" font-weight="700">🃏 CardTrade Market</text>
  <circle cx="1100" cy="32" r="16" fill="rgba(255,255,255,0.2)"/>
  <text x="1095" y="37" fill="white" font-size="14">🛒(2)</text>

  <text x="60" y="110" font-size="24" font-weight="700" fill="#111827">MI CARRITO (2 artículos)</text>

  <!-- Cart Items -->
  <rect x="60" y="130" width="760" height="280" rx="12" fill="white" filter="url(#sh)"/>

  <g transform="translate(80, 150)">
    <rect width="120" height="120" rx="12" fill="#FEF3C7"/>
    <text x="60" y="70" text-anchor="middle" font-size="36">🃏</text>
    <text x="150" y="40" font-size="16" font-weight="600" fill="#111827">Charizard ex 199/165</text>
    <text x="150" y="60" font-size="12" fill="#6B7280">Pokémon • Obsidian Flames • Ultra Rare</text>
    <text x="150" y="80" font-size="12" fill="#6B7280">Vendedor: CardMaster MX ⭐ 4.8</text>

    <text x="600" y="40" font-size="18" font-weight="700" fill="#3B82F6">$45.00</text>
    <rect x="600" y="70" width="80" height="36" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="610" y="92" font-size="16" font-weight="600" fill="#111827">−</text>
    <text x="650" y="92" font-size="16" font-weight="600" fill="#111827">1</text>
    <text x="680" y="92" font-size="16" font-weight="600" fill="#111827">+</text>
    <text x="600" y="120" font-size="12" fill="#EF4444">Eliminar</text>
  </g>

  <line x1="80" y1="285" x2="720" y2="285" stroke="#E5E7EB" stroke-width="1"/>

  <g transform="translate(80, 300)">
    <rect width="120" height="120" rx="12" fill="#DBEAFE"/>
    <text x="60" y="70" text-anchor="middle" font-size="36">🃏</text>
    <text x="150" y="40" font-size="16" font-weight="600" fill="#111827">Pikachu VMAX 188/185</text>
    <text x="150" y="60" font-size="12" fill="#6B7280">Pokémon • Vivid Voltage • VMAX</text>
    <text x="150" y="80" font-size="12" fill="#6B7280">Vendedor: PikaFan99 ⭐ 4.6</text>

    <text x="600" y="40" font-size="18" font-weight="700" fill="#3B82F6">$28.00</text>
    <rect x="600" y="70" width="80" height="36" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="610" y="92" font-size="16" font-weight="600" fill="#111827">−</text>
    <text x="650" y="92" font-size="16" font-weight="600" fill="#111827">1</text>
    <text x="680" y="92" font-size="16" font-weight="600" fill="#111827">+</text>
    <text x="600" y="120" font-size="12" fill="#EF4444">Eliminar</text>
  </g>

  <!-- Order Summary -->
  <rect x="860" y="130" width="280" height="520" rx="12" fill="white" filter="url(#sh)"/>
  <text x="1000" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">RESUMEN</text>

  <line x1="880" y1="185" x2="980" y2="185" stroke="#E5E7EB" stroke-width="1"/>

  <text x="880" y="215" font-size="14" fill="#6B7280">Subtotal (2 artículos)</text>
  <text x="1060" y="215" text-anchor="end" font-size="14" font-weight="600" fill="#111827">$73.00</text>

  <text x="880" y="245" font-size="14" fill="#6B7280">Envío estimado</text>
  <text x="1060" y="245" text-anchor="end" font-size="14" fill="#3B82F6">Gratis</text>

  <text x="880" y="275" font-size="14" fill="#6B7280">Comisión plataforma (5%)</text>
  <text x="1060" y="275" text-anchor="end" font-size="14" fill="#6B7280">$3.65</text>

  <line x1="880" y1="300" x2="980" y2="300" stroke="#E5E7EB" stroke-width="2"/>

  <text x="880" y="330" font-size="18" font-weight="700" fill="#111827">TOTAL</text>
  <text x="1060" y="330" text-anchor="end" font-size="22" font-weight="700" fill="#3B82F6">$76.65</text>

  <rect x="880" y="355" width="200" height="48" rx="8" fill="#3B82F6"/>
  <text x="980" y="385" text-anchor="middle" fill="white" font-size="15" font-weight="600">PROCEDER AL PAGO</text>

  <rect x="880" y="420" width="200" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="980" y="450" text-anchor="middle" fill="#6B7280" font-size="14">Seguir comprando</text>

  <text x="880" y="485" font-size="12" fill="#6B7280">✓ Envío gratis por compra >$500</text>
  <text x="880" y="505" font-size="12" fill="#6B7280">✓ Seguro incluido</text>
  <text x="880" y="525" font-size="12" fill="#6B7280">✓ Protección al comprador</text>
</svg>
<svg viewBox="0 0 1200 1050" xmlns="http://www.w3.org/2000/svg">
  <title>Gestionar Direcciones</title>
  <desc>Lista de direcciones guardadas con formulario para agregar nueva</desc>
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cardShadow"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .header-text{font-size:20px;font-weight:700;fill:white}
    .page-title{font-size:24px;font-weight:700;fill:#111827}
    .addr-name{font-size:16px;font-weight:600;fill:#111827}
    .addr-line{font-size:13px;fill:#374151}
    .addr-badge{font-size:12px;font-weight:600;fill:#3B82F6}
    .btn-edit{font-size:12px;fill:#6B7280}
    .btn-delete{font-size:12px;fill:#EF4444}
    .btn-set-default{font-size:12px;font-weight:600;fill:white}
    .modal-title{font-size:22px;font-weight:700;fill:#111827}
    .label{font-size:13px;font-weight:500;fill:#374151}
    .select-text{font-size:14px;fill:#111827}
    .placeholder{font-size:14px;fill:#9CA3AF}
    .footer-text{font-size:12px;fill:#9CA3AF}
    .footer-link{font-size:12px;fill:#6B7280}
  </style>
  <rect width="1200" height="1050" fill="#F3F4F6"/>
  <g id="header">
    <rect width="1200" height="64" fill="url(#headerGrad)"/>
    <text x="40" y="42" class="header-text">&#x1F0CF; CardTrade Market</text>
  </g>
  <g id="main-content">
    <text x="60" y="115" class="page-title">GESTIONAR DIRECCIONES</text>
    <rect x="60" y="140" width="1080" height="160" rx="12" fill="white" filter="url(#cardShadow)" stroke="#3B82F6" stroke-width="2"/>
    <rect x="85" y="160" width="22" height="22" rx="4" fill="#3B82F6"/><circle cx="96" cy="171" r="7" fill="white"/>
    <text x="120" y="185" class="addr-name">Principal - Casa</text>
    <text x="120" y="208" class="addr-line">Carlos Martinez Lopez</text>
    <text x="120" y="228" class="addr-line">Av. Insurgentes Sur 1234, Col. Del Valle</text>
    <text x="120" y="248" class="addr-line">Ciudad de Mexico, CDMX 03100</text>
    <text x="120" y="268" class="addr-line">&#x1F4DE; +52 55 1234 5678</text>
    <rect x="920" y="158" width="180" height="34" rx="6" fill="#EFF6FF"/>
    <text x="1010" y="180" text-anchor="middle" class="addr-badge">Predeterminada</text>
    <rect x="920" y="205" width="80" height="34" rx="6" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="960" y="227" text-anchor="middle" class="btn-edit">Editar</text>
    <rect x="1020" y="205" width="80" height="34" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
    <text x="1060" y="227" text-anchor="middle" class="btn-delete">Eliminar</text>
    <rect x="60" y="320" width="1080" height="160" rx="12" fill="white" filter="url(#cardShadow)"/>
    <text x="120" y="365" class="addr-name">Oficina</text>
    <text x="120" y="388" class="addr-line">Carlos Martinez Lopez</text>
    <text x="120" y="408" class="addr-line">Torre Reforma, Piso 15, Av. Paseo de la Reforma 500</text>
    <text x="120" y="428" class="addr-line">Ciudad de Mexico, CDMX 06600</text>
    <rect x="920" y="358" width="80" height="34" rx="6" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="960" y="380" text-anchor="middle" class="btn-edit">Editar</text>
    <rect x="1020" y="358" width="80" height="34" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
    <text x="1060" y="380" text-anchor="middle" class="btn-delete">Eliminar</text>
    <rect x="920" y="405" width="160" height="34" rx="6" fill="#3B82F6"/>
    <text x="1000" y="427" text-anchor="middle" class="btn-set-default">Hacer Predeterminada</text>
    <rect x="60" y="500" width="1080" height="80" rx="12" fill="white" filter="url(#cardShadow)" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="600" y="548" text-anchor="middle" font-size="16" fill="#6B7280">+ AGREGAR NUEVA DIRECCION</text>
  </g>
  <g id="footer">
    <rect x="0" y="970" width="1200" height="80" fill="#1F2937"/>
    <text x="600" y="1005" text-anchor="middle" class="footer-text">&#xA9; 2026 CardTrade Market. Todos los derechos reservados.</text>
    <text x="600" y="1025" text-anchor="middle" class="footer-link">Terminos | Privacidad | Contacto | Ayuda</text>
  </g>
</svg>
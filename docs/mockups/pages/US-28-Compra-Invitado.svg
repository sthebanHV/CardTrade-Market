<svg viewBox="0 0 1200 950" xmlns="http://www.w3.org/2000/svg">
  <title>Compra como Invitado</title>
  <desc>Flujo de compra rapida sin crear cuenta</desc>
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cardShadow"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .header-text{font-size:20px;font-weight:700;fill:white}
    .guest-badge{font-size:12px;font-weight:600;fill:#92400E}
    .page-title{font-size:24px;font-weight:700;fill:#111827}
    .subtitle{font-size:14px;fill:#6B7280}
    .section-title{font-size:16px;font-weight:700;fill:#111827}
    .step-complete{font-size:12px;font-weight:600;fill:white}
    .step-pending{font-size:12px;fill:#9CA3AF}
    .label{font-size:13px;font-weight:500;fill:#374151}
    .placeholder{font-size:14px;fill:#9CA3AF}
    .btn-primary{font-size:15px;font-weight:600;fill:white}
    .login-link{font-size:12px;fill:#6B7280}
    .card-title{font-size:13px;font-weight:600;fill:#111827}
    .card-meta{font-size:12px;fill:#6B7280}
    .price{font-size:13px;font-weight:700;fill:#3B82F6}
    .summary-label{font-size:13px;fill:#6B7280}
    .summary-value{font-size:13px;font-weight:600;fill:#111827}
    .total-label{font-size:16px;font-weight:700;fill:#111827}
    .total-value{font-size:20px;font-weight:700;fill:#3B82F6}
    .footer-text{font-size:12px;fill:#9CA3AF}
    .footer-link{font-size:12px;fill:#6B7280}
  </style>
  <rect width="1200" height="950" fill="#F3F4F6"/>
  <g id="header">
    <rect width="1200" height="64" fill="url(#headerGrad)"/>
    <text x="40" y="42" class="header-text">&#x1F0CF; CardTrade Market</text>
    <rect x="1000" y="16" width="160" height="32" rx="16" fill="#FEF3C7"/>
    <text x="1080" y="37" text-anchor="middle" class="guest-badge">&#x1F464; MODO INVITADO</text>
  </g>
  <g id="main-content">
    <text x="60" y="115" class="page-title">COMPRA RAPIDA (INVITADO)</text>
    <text x="60" y="140" class="subtitle">Completa tu compra sin crear cuenta</text>
    <rect x="60" y="155" width="1080" height="40" rx="20" fill="#E5E7EB"/>
    <rect x="60" y="155" width="270" height="40" rx="20" fill="#3B82F6"/>
    <text x="195" y="180" text-anchor="middle" class="step-complete">1. Email</text>
    <text x="465" y="180" text-anchor="middle" class="step-pending">2. Envio</text>
    <text x="735" y="180" text-anchor="middle" class="step-pending">3. Pago</text>
    <text x="1005" y="180" text-anchor="middle" class="step-pending">4. Confirmar</text>
    <rect x="60" y="215" width="570" height="340" rx="12" fill="white" filter="url(#cardShadow)"/>
    <text x="100" y="260" class="section-title">CORREO ELECTRONICO</text>
    <text x="100" y="285" class="subtitle">Te enviaremos la confirmacion y tracking aqui</text>
    <text x="100" y="320" class="label">Email *</text>
    <rect x="100" y="330" width="500" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="120" y="358" class="placeholder">comprador@email.com</text>
    <text x="100" y="395" class="label">Confirmar Email *</text>
    <rect x="100" y="405" width="500" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="120" y="433" class="placeholder">comprador@email.com</text>
    <rect x="100" y="470" width="500" height="48" rx="8" fill="#3B82F6"/>
    <text x="350" y="500" text-anchor="middle" class="btn-primary">CONTINUAR AL ENVIO</text>
    <text x="350" y="535" text-anchor="middle" class="login-link">&#xBF;Ya tienes cuenta? Inicia sesion para guardar tus datos</text>
    <rect x="660" y="215" width="480" height="340" rx="12" fill="#F9FAFB"/>
    <text x="900" y="260" text-anchor="middle" class="section-title">TU PEDIDO</text>
    <rect x="685" y="280" width="80" height="80" rx="8" fill="#FEF3C7"/>
    <text x="725" y="330" text-anchor="middle" font-size="28">&#x1F0CF;</text>
    <text x="780" y="305" class="card-title">Charizard ex</text>
    <text x="780" y="330" class="card-meta">$45.00</text>
    <text x="780" y="350" class="card-meta">Vendedor: CardMaster MX</text>
    <rect x="685" y="375" width="80" height="80" rx="8" fill="#DBEAFE"/>
    <text x="725" y="425" text-anchor="middle" font-size="28">&#x1F0CF;</text>
    <text x="780" y="400" class="card-title">Pikachu VMAX</text>
    <text x="780" y="425" class="card-meta">$28.00</text>
    <text x="780" y="445" class="card-meta">Vendedor: PikaFan99</text>
    <line x1="685" y1="475" x2="1100" y2="475" stroke="#E5E7EB" stroke-width="1"/>
    <text x="685" y="500" class="summary-label">Subtotal</text>
    <text x="1100" y="500" text-anchor="end" class="summary-value">$73.00</text>
    <text x="685" y="525" class="summary-label">Envio</text>
    <text x="1100" y="525" text-anchor="end" style="font-size:13px;fill:#3B82F6">Gratis</text>
    <text x="685" y="550" class="summary-label">Comision (5%)</text>
    <text x="1100" y="550" text-anchor="end" class="summary-label">$3.65</text>
    <line x1="685" y1="575" x2="1100" y2="575" stroke="#E5E7EB" stroke-width="2"/>
    <text x="685" y="600" class="total-label">TOTAL</text>
    <text x="1100" y="600" text-anchor="end" class="total-value">$76.65</text>
  </g>
  <g id="footer">
    <rect x="0" y="870" width="1200" height="80" fill="#1F2937"/>
    <text x="600" y="905" text-anchor="middle" class="footer-text">&#xA9; 2026 CardTrade Market. Todos los derechos reservados.</text>
    <text x="600" y="925" text-anchor="middle" class="footer-link">Terminos | Privacidad | Contacto | Ayuda</text>
  </g>
</svg>
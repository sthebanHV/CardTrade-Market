<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <title>Cartas en Oferta</title>
  <desc>Wireframe de pagina de cartas en oferta con banner de temporizador y grid de ofertas</desc>
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cardShadow"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .page-title{font-size:24px;font-weight:700;fill:#111827}
    .card-title{font-size:14px;font-weight:600;fill:#111827}
    .card-meta{font-size:12px;fill:#6B7280}
    .card-price{font-size:14px;font-weight:700;fill:#3B82F6}
    .header-text{font-size:20px;font-weight:700;fill:white}
    .muted{font-size:14px;fill:#6B7280}
    .footer-text{font-size:12px;fill:#9CA3AF}
    .footer-link{font-size:12px;fill:#6B7280}
  </style>
  <rect width="1200" height="900" fill="#F3F4F6"/>
  <g id="header">
    <rect width="1200" height="64" fill="url(#headerGrad)"/>
    <text x="40" y="42" class="header-text">&#x1F0CF; CardTrade Market</text>
  </g>
  <g id="main-content">
    <text x="60" y="110" class="page-title">&#x1F525; CARTAS EN OFERTA</text>
    <text x="60" y="135" class="muted">Descuentos exclusivos por tiempo limitado</text>
    <rect x="60" y="150" width="1080" height="60" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
    <text x="100" y="185" font-size="14" font-weight="600" fill="#92400E">&#x23F0; Ofertas terminan en:</text>
    <rect x="320" y="165" width="50" height="32" rx="6" fill="#92400E"/>
    <text x="345" y="186" text-anchor="middle" fill="white" font-size="14" font-weight="700">23</text>
    <text x="370" y="185" fill="#92400E" font-size="14" font-weight="600">:</text>
    <rect x="385" y="165" width="50" height="32" rx="6" fill="#92400E"/>
    <text x="410" y="186" text-anchor="middle" fill="white" font-size="14" font-weight="700">45</text>
    <text x="435" y="185" fill="#92400E" font-size="14" font-weight="600">:</text>
    <rect x="450" y="165" width="50" height="32" rx="6" fill="#92400E"/>
    <text x="475" y="186" text-anchor="middle" fill="white" font-size="14" font-weight="700">12</text>
    <text x="530" y="185" fill="#92400E" font-size="13">horas</text>
    <g transform="translate(60,230)">
      <rect width="240" height="220" rx="12" fill="white" filter="url(#cardShadow)"/>
      <rect x="5" y="5" width="50" height="24" rx="4" fill="#EF4444"/>
      <text x="30" y="21" text-anchor="middle" fill="white" font-size="11" font-weight="700">-35%</text>
      <rect width="240" height="140" rx="12" fill="#FEF3C7"/>
      <text x="120" y="80" text-anchor="middle" font-size="48">&#x1F0CF;</text>
      <text x="12" y="165" class="card-title">Charizard VMAX</text>
      <text x="12" y="185" class="card-meta">Brilliant Stars</text>
      <text x="12" y="203" font-size="12" fill="#EF4444" text-decoration="line-through">.00</text>
      <text x="12" y="185" font-size="18" font-weight="700" fill="#1E40AF">.00</text>
    </g>

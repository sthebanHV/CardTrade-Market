      <text x="12" y="185" font-size="18" font-weight="700" fill="#1E40AF">.00</text>
    </g>
    <g transform="translate(840,470)">
      <rect width="300" height="220" rx="12" fill="white" filter="url(#cardShadow)"/>
      <rect x="5" y="5" width="50" height="24" rx="4" fill="#EF4444"/>
      <text x="30" y="21" text-anchor="middle" fill="white" font-size="11" font-weight="700">-50%</text>
      <rect width="300" height="140" rx="12" fill="#D1FAE5"/>

<svg viewBox="0 0 1200 1020" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .title { font-size: 24px; font-weight: 700; fill: #111827; }
    .section-title { font-size: 16px; font-weight: 700; fill: #111827; }
    .rating-bar-bg { fill: #FEF3C7; }
    .rating-bar-fill { fill: #F59E0B; }
    .rating-count { font-size: 13px; fill: #6B7280; }
    .form-title { font-size: 16px; font-weight: 700; fill: #111827; }
    .form-subtitle { font-size: 12px; fill: #6B7280; }
    .rating-title { font-size: 14px; font-weight: 600; fill: #111827; }
    .star { font-size: 28px; fill: #E5E7EB; }
    .comment-placeholder { font-size: 13px; fill: #9CA3AF; }
    .btn-secondary { font-size: 13px; fill: #6B7280; }
    .btn-primary { font-size: 13px; font-weight: 600; fill: white; }
    .review-title { font-size: 18px; font-weight: 700; fill: #111827; }
    .reviewer-name { font-size: 14px; font-weight: 600; fill: #111827; }
    .review-rating { font-size: 12px; fill: #F59E0B; }
    .review-meta { font-size: 12px; fill: #6B7280; }
    .review-text { font-size: 13px; fill: #374151; }
  </style>

  <rect width="1200" height="1020" fill="#F3F4F6"/>
  <rect width="1200" height="64" fill="url(#hg)"/>
  <text x="40" y="42" font-size="20" font-weight="700" fill="white">🃏 CardTrade Market</text>

  <text x="60" y="110" font-size="24" font-weight="700" fill="#111827">RESEÑAS Y CALIFICACIONES</text>

  <!-- Seller Header -->
  <rect x="60" y="140" width="1080" height="120" rx="12" fill="white" filter="url(#sh)"/>
  <circle cx="110" cy="200" r="35" fill="#3B82F6"/>
  <text x="110" y="206" text-anchor="middle" fill="white" font-size="16" font-weight="700">CM</text>
  <text x="160" y="180" font-size="18" font-weight="600" fill="#111827">CardMaster MX</text>
  <text x="160" y="200" font-size="13" fill="#6B7280">Vendedor • 342 ventas</text>
  <text x="900" y="180" font-size="36" font-weight="700" fill="#111827">⭐ 4.8</text>
  <text x="900" y="205" font-size="13" fill="#6B7280">(125 reseñas)</text>
  <text x="1050" y="180" font-size="13" fill="#10B981">99% positivas</text>
  <text x="1050" y="205" font-size="13" fill="#6B7280">Tiempo resp.: 2.3h</text>

  <!-- Rating Breakdown -->
  <rect x="60" y="280" width="500" height="380" rx="12" fill="white" filter="url(#sh)"/>
  <text x="80" y="315" font-size="16" font-weight="700" fill="#111827">DISTRIBUCIÓN DE ESTRELLAS</text>
  
  <g transform="translate(80, 330)">
    <text y="25" font-size="13" fill="#111827">5 ⭐</text>
    <rect x="60" y="10" width="300" height="20" rx="8" class="rating-bar-bg"/>
    <rect x="60" y="10" width="279" height="20" rx="8" class="rating-bar-fill"/>
    <text x="380" y="25" class="rating-count">112 (89.6%)</text>
  </g>
  <g transform="translate(80, 375)">
    <text y="25" font-size="13" fill="#111827">4 ⭐</text>
    <rect x="60" y="10" width="300" height="20" rx="8" class="rating-bar-bg"/>
    <rect x="60" y="10" width="15" height="20" rx="8" class="rating-bar-fill"/>
    <text x="380" y="25" class="rating-count">6 (4.8%)</text>
  </g>
  <g transform="translate(80, 420)">
    <text y="25" font-size="13" fill="#111827">3 ⭐</text>
    <rect x="60" y="10" width="300" height="20" rx="8" class="rating-bar-bg"/>
    <rect x="60" y="10" width="9" height="20" rx="8" class="rating-bar-fill"/>
    <text x="380" y="25" class="rating-count">3 (2.4%)</text>
  </g>
  <g transform="translate(80, 465)">
    <text y="25" font-size="13" fill="#111827">2 ⭐</text>
    <rect x="60" y="10" width="300" height="20" rx="8" class="rating-bar-bg"/>
    <rect x="60" y="10" width="6" height="20" rx="8" class="rating-bar-fill"/>
    <text x="380" y="25" class="rating-count">2 (1.6%)</text>
  </g>
  <g transform="translate(80, 510)">
    <text y="25" font-size="13" fill="#111827">1 ⭐</text>
    <rect x="60" y="10" width="300" height="20" rx="8" class="rating-bar-bg"/>
    <rect x="60" y="10" width="3" height="20" rx="8" class="rating-bar-fill"/>
    <text x="380" y="25" class="rating-count">2 (1.6%)</text>
  </g>

  <!-- Write Review Form -->
  <rect x="580" y="280" width="560" height="380" rx="12" fill="white" filter="url(#sh)"/>
  <text x="600" y="315" font-size="16" font-weight="700" fill="#111827">ESCRIBIR RESEÑA</text>
  <text x="600" y="335" font-size="12" fill="#6B7280">Solo si compraste a este vendedor</text>

  <text x="600" y="370" font-size="14" font-weight="600" fill="#111827">Tu Calificación</text>
  <g transform="translate(600, 385)">
    <text x="0" y="30" font-size="28" fill="#E5E7EB">☆</text>
    <text x="40" y="30" font-size="28" fill="#E5E7EB">☆</text>
    <text x="80" y="30" font-size="28" fill="#E5E7EB">☆</text>
    <text x="120" y="30" font-size="28" fill="#E5E7EB">☆</text>
    <text x="160" y="30" font-size="28" fill="#E5E7EB">☆</text>
  </g>

  <text x="600" y="430" font-size="13" font-weight="500" fill="#374151">Tu Comentario (opcional)</text>
  <rect x="600" y="440" width="520" height="100" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="620" y="470" class="comment-placeholder">¿Cómo fue tu experiencia? ¿Llegó bien el paquete?...</text>

  <rect x="600" y="555" width="240" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="720" y="583" text-anchor="middle" class="btn-secondary">Cancelar</text>
  <rect x="860" y="555" width="260" height="44" rx="8" fill="#3B82F6"/>
  <text x="990" y="583" text-anchor="middle" font-size="13" font-weight="600" fill="white">PUBLICAR RESEÑA</text>

  <!-- Reviews List -->
  <text x="60" y="690" font-size="18" font-weight="700" fill="#111827">RESEÑAS RECIENTES</text>

  <g transform="translate(60, 710)">
    <rect width="1080" height="140" rx="12" fill="white" filter="url(#sh)"/>
    <circle cx="50" cy="70" r="25" fill="#10B981"/>
    <text x="50" y="75" text-anchor="middle" fill="white" font-size="12" font-weight="600">JD</text>
    <text x="90" y="45" class="reviewer-name">Juan D.</text>
    <text x="90" y="65" class="review-rating">⭐⭐⭐⭐⭐</text>
    <text x="90" y="85" class="review-meta">Hace 2 días • Compra: Charizard ex</text>
    <text x="90" y="105" class="review-text">Excelente vendedor, carta en perfecto estado y envío rápido.</text>
  </g>

  <g transform="translate(60, 870)">
    <rect width="1080" height="140" rx="12" fill="white" filter="url(#sh)"/>
    <circle cx="50" cy="70" r="25" fill="#3B82F6"/>
    <text x="50" y="75" text-anchor="middle" fill="white" font-size="12" font-weight="600">MG</text>
    <text x="90" y="45" class="reviewer-name">María G.</text>
    <text x="90" y="65" class="review-rating">⭐⭐⭐⭐⭐</text>
    <text x="90" y="85" class="review-meta">Hace 5 días • Compra: Pikachu VMAX</text>
    <text x="90" y="105" class="review-text">Muy buena comunicación, empaque seguro. Volveré a comprar.</text>
  </g>
</svg>
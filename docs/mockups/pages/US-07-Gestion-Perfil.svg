<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <title>Gestion de Perfil</title>
  <desc>Wireframe de gestion de perfil de usuario con encabezado de perfil, tabs de navegacion, formulario de edicion con campos de usuario, correo, nombre, telefono, ubicacion, biografia y foto de perfil</desc>
  
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .page-title { font-size: 22px; font-weight: 700; fill: #111827; }
    .page-subtitle { font-size: 14px; fill: #6B7280; }
    .section-title { font-size: 18px; font-weight: 700; fill: #111827; }
    .card-title { font-size: 14px; font-weight: 600; fill: #111827; }
    .card-meta { font-size: 12px; fill: #6B7280; }
    .card-price { font-size: 13px; font-weight: 600; fill: #3B82F6; }
    .header-text { font-size: 20px; font-weight: 700; fill: white; }
    .placeholder { font-size: 14px; fill: #9CA3AF; }
    .btn-primary { fill: #3B82F6; }
    .btn-text { font-size: 14px; font-weight: 600; fill: white; }
    .btn-secondary { fill: white; stroke: #D1D5DB; stroke-width: 1.5; }
    .label { font-size: 13px; font-weight: 500; fill: #374151; }
    .input-text { font-size: 14px; fill: #111827; }
    .input-placeholder { font-size: 14px; fill: #9CA3AF; }
    .link { font-size: 13px; fill: #3B82F6; font-weight: 500; }
    .muted { font-size: 14px; fill: #6B7280; }
    .small-muted { font-size: 12px; fill: #6B7280; }
    .hint { font-size: 11px; fill: #6B7280; }
    .footer-text { font-size: 12px; fill: #9CA3AF; }
    .footer-link { font-size: 12px; fill: #6B7280; }
    .stat-text { font-size: 14px; fill: #6B7280; }
    .hero-title { font-size: 32px; font-weight: 700; fill: white; }
    .hero-subtitle { font-size: 18px; fill: rgba(255,255,255,0.85); }
    .tab-active { fill: #3B82F6; }
    .tab-text-active { font-size: 13px; font-weight: 500; fill: white; }
    .tab-text-inactive { font-size: 13px; fill: #6B7280; }
    .info-box { fill: #EFF6FF; stroke: #BFDBFE; stroke-width: 1; }
    .info-text { font-size: 13px; fill: #1E40AF; }
    .info-link { font-size: 12px; fill: #3B82F6; }
  </style>

  <rect width="1200" height="900" fill="#F3F4F6"/>

  <g id="header">
    <rect width="1200" height="64" fill="url(#headerGrad)"/>
    <text x="40" y="42" class="header-text">&#127183; CardTrade Market</text>
  </g>

  <g id="main-content">
    <text x="60" y="110" class="page-title">MI PERFIL</text>

    <rect x="60" y="130" width="1080" height="140" rx="12" fill="white" filter="url(#cardShadow)"/>
    <circle cx="130" cy="200" r="50" fill="#3B82F6"/>
    <text x="130" y="208" text-anchor="middle" fill="white" font-size="28" font-weight="700">CM</text>
    <text x="200" y="180" font-size="20" font-weight="700" fill="#111827">CardMaster MX</text>
    <text x="200" y="200" class="muted">Miembro desde Enero 2024</text>
    <text x="200" y="220" class="small-muted">&#11088; 4.8 (125 rese&#241;as) &#8226; 342 ventas</text>
    <rect x="980" y="175" width="140" height="36" rx="8" fill="#3B82F6"/>
    <text x="1050" y="198" text-anchor="middle" fill="white" font-size="13" font-weight="600">&#9998;&#65039; Editar Perfil</text>

    <rect x="60" y="290" width="1080" height="44" rx="8" fill="white" filter="url(#cardShadow)"/>
    <rect x="65" y="295" width="120" height="34" rx="6" fill="#3B82F6"/>
    <text x="125" y="317" text-anchor="middle" class="tab-text-active">Perfil</text>
    <text x="230" y="317" class="tab-text-inactive">Publicaciones</text>
    <text x="370" y="317" class="tab-text-inactive">Rese&#241;as</text>
    <text x="480" y="317" class="tab-text-inactive">Seguidores (89)</text>

    <rect x="60" y="350" width="1080" height="480" rx="12" fill="white" filter="url(#cardShadow)"/>

    <text x="100" y="395" class="label">Nombre de Usuario</text>
    <rect x="100" y="405" width="480" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="120" y="433" class="input-text">CardMaster MX</text>

    <text x="620" y="395" class="label">Correo Electr&#243;nico</text>
    <rect x="620" y="405" width="480" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="640" y="433" class="input-text">&#128231; cardmaster@email.com &#10004; Verificado</text>

    <text x="100" y="475" class="label">Nombre Completo</text>
    <rect x="100" y="485" width="480" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="120" y="513" class="input-text">Carlos Mart&#237;nez L&#243;pez</text>

    <text x="620" y="475" class="label">Tel&#233;fono</text>
    <rect x="620" y="485" width="480" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="640" y="513" class="input-text">+52 55 1234 5678</text>

    <text x="100" y="555" class="label">Ubicaci&#243;n</text>
    <rect x="100" y="565" width="480" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="120" y="593" class="input-text">&#128205; Ciudad de M&#233;xico, M&#233;xico</text>

    <text x="620" y="555" class="label">Biograf&#237;a</text>
    <rect x="620" y="565" width="480" height="80" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="640" y="593" class="input-text">Coleccionista de P&#243;kemon desde 2005. Especialista en cartas vintage.</text>

    <text x="100" y="665" class="label">Foto de Perfil</text>
    <circle cx="150" cy="730" r="50" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="150" y="735" text-anchor="middle" font-size="24" fill="#9CA3AF">&#128247;</text>
    <text x="150" y="795" text-anchor="middle" class="hint">Subir foto</text>

    <rect x="100" y="830" width="480" height="44" rx="8" fill="#3B82F6"/>
    <text x="340" y="858" text-anchor="middle" fill="white" font-size="14" font-weight="600">GUARDAR CAMBIOS</text>

    <rect x="620" y="830" width="480" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="860" y="858" text-anchor="middle" class="muted" font-size="14">Cancelar</text>
  </g>

  <g id="footer">
    <rect x="0" y="820" width="1200" height="80" fill="#1F2937"/>
    <text x="600" y="855" text-anchor="middle" class="footer-text">&#169; 2026 CardTrade Market. Todos los derechos reservados.</text>
    <text x="600" y="875" text-anchor="middle" class="footer-link">T&#233;rminos | Privacidad | Contacto | Ayuda</text>
  </g>
</svg>

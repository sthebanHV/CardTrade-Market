<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <title>Gestionar Publicaciones</title>
  <desc>Wireframe de pagina de gestion de publicaciones con lista de cartas en venta</desc>
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cardShadow"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .page-title{font-size:24px;font-weight:700;fill:#111827}
    .section-title{font-size:16px;font-weight:700;fill:#111827}
    .card-title{font-size:14px;font-weight:600;fill:#111827}
    .card-meta{font-size:12px;fill:#6B7280}
    .card-price{font-size:14px;font-weight:700;fill:#3B82F6}
    .header-text{font-size:20px;font-weight:700;fill:white}
    .muted{font-size:14px;fill:#6B7280}
    .small-muted{font-size:12px;fill:#6B7280}
    .footer-text{font-size:12px;fill:#9CA3AF}
    .footer-link{font-size:12px;fill:#6B7280}
    .stat-text{font-size:14px;fill:#6B7280}
  </style>
  <rect width="1200" height="900" fill="#F3F4F6"/>
  <g id="header">
    <rect width="1200" height="64" fill="url(#headerGrad)"/>
    <text x="40" y="42" class="header-text">&#x1F0CF; CardTrade Market</text>
  </g>
  <g id="main-content">
    <text x="60" y="110" class="page-title">MIS PUBLICACIONES</text>
    <text x="60" y="135" class="muted">Gestiona tus cartas en venta</text>
    <rect x="60" y="155" width="1080" height="60" rx="12" fill="white" filter="url(#cardShadow)"/>
    <text x="120" y="190" font-size="24" font-weight="700" fill="#3B82F6">12</text>
    <text x="120" y="205" class="small-muted">Activas</text>
    <text x="300" y="190" font-size="24" font-weight="700" fill="#10B981">8</text>
    <text x="300" y="205" class="small-muted">Vendidas</text>
    <text x="480" y="190" font-size="24" font-weight="700" fill="#F59E0B">3</text>
    <text x="480" y="205" class="small-muted">Borradores</text>
    <text x="660" y="190" font-size="24" font-weight="700" fill="#EF4444">1</text>
    <text x="660" y="205" class="small-muted">Expiradas</text>
    <text x="840" y="190" font-size="24" font-weight="700" fill="#3B82F6">,240</text>
    <text x="840" y="205" class="small-muted">Ganancias totales</text>
    <rect x="60" y="240" width="1080" height="44" rx="8" fill="white" filter="url(#cardShadow)"/>
    <rect x="65" y="245" width="100" height="34" rx="6" fill="#3B82F6"/>
    <text x="115" y="267" text-anchor="middle" fill="white" font-size="12" font-weight="500">Todas (12)</text>
    <text x="200" y="267" class="small-muted">Activas (8)</text>
    <text x="290" y="267" class="small-muted">Vendidas (4)</text>
    <text x="380" y="267" class="small-muted">Borradores (3)</text>
    <text x="470" y="267" class="small-muted">Expiradas (1)</text>
    <g transform="translate(60,310)">
      <rect width="1080" height="110" rx="12" fill="white" filter="url(#cardShadow)"/>
      <rect x="20" y="10" width="90" height="90" rx="8" fill="#FEF3C7"/>
      <text x="65" y="62" text-anchor="middle" font-size="36">&#x1F0CF;</text>
      <text x="130" y="40" font-size="16" font-weight="600" fill="#111827">Charizard ex 199/165</text>
      <text x="130" y="60" class="card-meta">Pokemon &#x2022; Obsidian Flames &#x2022; Ultra Rare</text>
      <text x="130" y="80" class="card-meta">Publicado: 15 Ene 2025 &#x2022; 23 vistas</text>
      <rect x="800" y="15" width="80" height="30" rx="15" fill="#D1FAE5"/>
      <text x="840" y="33" text-anchor="middle" fill="#065F46" font-size="11" font-weight="600">ACTIVA</text>
      <text x="950" y="45" font-size="20" font-weight="700" fill="#3B82F6">.00</text>
      <rect x="950" y="70" width="80" height="30" rx="15" fill="#EFF6FF"/>
      <text x="990" y="88" text-anchor="middle" fill="#3B82F6" font-size="11" font-weight="600">Editar</text>
    </g>
    <g transform="translate(60,440)">
      <rect width="1080" height="110" rx="12" fill="white" filter="url(#cardShadow)"/>
      <rect x="20" y="10" width="90" height="90" rx="8" fill="#DBEAFE"/>
      <text x="65" y="62" text-anchor="middle" font-size="36">&#x1F0CF;</text>
      <text x="130" y="40" font-size="16" font-weight="600" fill="#111827">Pikachu VMAX 188/185</text>
      <text x="130" y="60" class="card-meta">Pokemon &#x2022; Vivid Voltage &#x2022; VMAX</text>
      <text x="130" y="80" class="card-meta">Publicado: 10 Ene 2025 &#x2022; 45 vistas</text>
      <rect x="800" y="15" width="80" height="30" rx="15" fill="#D1FAE5"/>
      <text x="840" y="33" text-anchor="middle" fill="#065F46" font-size="11" font-weight="600">ACTIVA</text>
      <text x="950" y="45" font-size="20" font-weight="700" fill="#3B82F6">.00</text>
      <rect x="950" y="70" width="80" height="30" rx="15" fill="#EFF6FF"/>
      <text x="990" y="88" text-anchor="middle" fill="#3B82F6" font-size="11" font-weight="600">Editar</text>
    </g>
    <g transform="translate(60,570)">
      <rect width="1080" height="110" rx="12" fill="white" filter="url(#cardShadow)"/>
      <rect x="20" y="10" width="90" height="90" rx="8" fill="#FEF3C7"/>
      <text x="65" y="62" text-anchor="middle" font-size="36">&#x1F0CF;</text>
      <text x="130" y="40" font-size="16" font-weight="600" fill="#111827">Mewtwo VSTAR 172/172</text>
      <text x="130" y="60" class="card-meta">Pokemon &#x2022; Brilliant Stars &#x2022; VSTAR</text>
      <text x="130" y="80" class="card-meta">Publicado: 5 Ene 2025 &#x2022; 67 vistas</text>
      <rect x="800" y="15" width="90" height="30" rx="15" fill="#FEF3C7"/>
      <text x="845" y="33" text-anchor="middle" fill="#92400E" font-size="11" font-weight="600">VENDIDA</text>
      <text x="950" y="45" font-size="20" font-weight="700" fill="#10B981">.00</text>
      <text x="950" y="75" font-size="11" fill="#10B981">&#x2713; Pagado y enviado</text>
    </g>
    <g transform="translate(60,700)">
      <rect width="1080" height="110" rx="12" fill="white" filter="url(#cardShadow)" opacity="0.6"/>
      <rect x="20" y="10" width="90" height="90" rx="8" fill="#F3F4F6"/>
      <text x="65" y="62" text-anchor="middle" font-size="36">&#x1F0CF;</text>
      <text x="130" y="40" font-size="16" font-weight="600" fill="#9CA3AF">Gyarados VMAX (Borrador)</text>
      <text x="130" y="60" font-size="12" fill="#9CA3AF">Pokemon &#x2022; Fusion Strike &#x2022; VMAX</text>
      <text x="130" y="80" font-size="12" fill="#9CA3AF">Ultima edicion: 12 Ene 2025</text>
      <rect x="800" y="15" width="90" height="30" rx="15" fill="#F3F4F6"/>
      <text x="845" y="33" text-anchor="middle" fill="#9CA3AF" font-size="11" font-weight="600">BORRADOR</text>
      <text x="950" y="45" font-size="20" font-weight="700" fill="#9CA3AF">.00</text>
      <rect x="950" y="70" width="80" height="30" rx="15" fill="#EFF6FF"/>
      <text x="990" y="88" text-anchor="middle" fill="#3B82F6" font-size="11" font-weight="600">Publicar</text>
    </g>
  </g>
  <g id="footer">
    <rect x="0" y="820" width="1200" height="80" fill="#1F2937"/>
    <text x="600" y="855" text-anchor="middle" class="footer-text">&#xA9; 2026 CardTrade Market. Todos los derechos reservados.</text>
    <text x="600" y="875" text-anchor="middle" class="footer-link">Terminos | Privacidad | Contacto | Ayuda</text>
  </g>
</svg>
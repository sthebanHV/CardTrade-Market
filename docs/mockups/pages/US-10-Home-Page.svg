    <rect width="240" height="180" rx="12" fill="white" filter="url(#sh)"/>
    <rect width="240" height="110" rx="12" fill="#DBEAFE"/>
    <text x="120" y="70" text-anchor="middle" font-size="36">🃏</text>
    <text x="12" y="135" class="card-title">Liliana of the Veil</text>
    <text x="12" y="155" class="card-meta">⭐ 4.7 • $85.00</text>

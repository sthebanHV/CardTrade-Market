  <text x="60" y="832" class="section-title">PUBLICACIONES RECIENTES</text>

  <g transform="translate(60, 856)">
    <rect width="240" height="180" rx="12" fill="white" filter="url(#sh)"/>
    <rect width="240" height="110" rx="12" fill="#FEF3C7"/>
    <text x="120" y="70" text-anchor="middle" font-size="36">🃏</text>

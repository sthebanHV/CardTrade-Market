<svg viewBox="0 0 1200 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="banner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .title { font-size: 24px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 14px; fill: #6B7280; }
    .section-title { font-size: 18px; font-weight: 700; fill: #111827; }
    .card-title { font-size: 14px; font-weight: 600; fill: #111827; }
    .card-meta { font-size: 12px; fill: #6B7280; }
    .card-price { font-size: 13px; font-weight: 600; fill: #3B82F6; }
    .header-text { font-size: 20px; font-weight: 700; fill: white; }
    .search-placeholder { font-size: 14px; fill: rgba(255,255,255,0.6); }
    .hero-title { font-size: 32px; font-weight: 700; fill: white; }
    .hero-subtitle { font-size: 18px; fill: rgba(255,255,255,0.85); }
    .btn-text { font-size: 14px; font-weight: 600; fill: #3B82F6; }
    .stat-text { font-size: 14px; fill: #6B7280; }
    .footer-text { font-size: 12px; fill: #9CA3AF; }
  </style>

  <rect width="1200" height="1080" fill="#F3F4F6"/>
  
  <!-- Header -->
  <rect width="1200" height="64" fill="url(#hg)"/>
  <text x="40" y="42" class="header-text">🃏 CardTrade Market</text>
  <rect x="350" y="16" width="400" height="32" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="370" y="38" class="search-placeholder">🔍 Buscar cartas...</text>
  <circle cx="1100" cy="32" r="16" fill="rgba(255,255,255,0.2)"/>
  <text x="1095" y="38" text-anchor="middle" font-size="14" fill="white">🛒(2)</text>
  <circle cx="1150" cy="32" r="16" fill="rgba(255,255,255,0.2)"/>
  <text x="1145" y="38" text-anchor="middle" font-size="14" fill="white">👤</text>

  <!-- Hero Banner -->
  <rect x="60" y="96" width="1080" height="220" rx="16" fill="url(#banner)"/>
  <text x="120" y="150" class="hero-title">Descubre Cartas Únicas</text>
  <text x="120" y="185" class="hero-subtitle">Miles de cartas coleccionables esperan por ti</text>
  <rect x="120" y="205" width="200" height="48" rx="8" fill="white"/>
  <text x="220" y="235" text-anchor="middle" class="btn-text">EXPLORAR CARTAS</text>

  <!-- Stats -->
  <text x="60" y="352" class="stat-text">12,500+ Usuarios  •  45,000+ Cartas  •  8,200+ Ventas</text>

  <!-- Categories -->
  <text x="60" y="400" class="section-title">CATEGORÍAS POPULARES</text>
  
  <g transform="translate(60, 420)">
    <rect width="240" height="110" rx="12" fill="white" filter="url(#sh)"/>
    <text x="120" y="70" text-anchor="middle" font-size="32">🎨</text>
    <text x="120" y="95" text-anchor="middle" class="card-title">Pokémon</text>
    <text x="120" y="115" text-anchor="middle" class="card-meta">18,500 cartas</text>
  </g>

  <g transform="translate(320, 420)">
    <rect width="240" height="110" rx="12" fill="white" filter="url(#sh)"/>
    <text x="120" y="70" text-anchor="middle" font-size="32">🔥</text>
    <text x="120" y="95" text-anchor="middle" class="card-title">Magic: The Gathering</text>
    <text x="120" y="115" text-anchor="middle" class="card-meta">12,300 cartas</text>

    <rect width="300" height="130" rx="12" fill="#D1FAE5"/>
    <text x="150" y="80" text-anchor="middle" font-size="40">🃏</text>
    <text x="150" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">One Piece</text>
    <text x="12" y="155" class="card-title">Monkey D. Luffy</text>
    <text x="12" y="178" class="card-price">$32.00</text>

  <g transform="translate(580, 596)">
    <rect width="240" height="200" rx="12" fill="white" filter="url(#sh)"/>
    <rect width="240" height="130" rx="12" fill="#FCE7F3"/>
    <text x="120" y="80" text-anchor="middle" font-size="40">🃏</text>
    <text x="120" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#9D174D">Yu-Gi-Oh!</text>
    <text x="12" y="155" class="card-title">Blue-Eyes White</text>
    <text x="12" y="178" class="card-price">$125.00</text>

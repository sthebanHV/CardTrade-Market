  <g transform="translate(580, 856)">
    <rect width="240" height="180" rx="12" fill="white" filter="url(#sh)"/>
    <rect width="240" height="110" rx="12" fill="#FCE7F3"/>
    <text x="120" y="70" text-anchor="middle" font-size="36">🃏</text>
    <text x="12" y="135" class="card-title">Dark Magician</text>
    <text x="12" y="155" class="card-meta">⭐ 4.8 • $18.00</text>
  </g>

  <g transform="translate(840, 856)">
    <rect width="300" height="180" rx="12" fill="white" filter="url(#sh)"/>
    <rect width="300" height="110" rx="12" fill="#D1FAE5"/>
    <text x="150" y="70" text-anchor="middle" font-size="36">🃏</text>
    <text x="12" y="135" class="card-title">Roronoa Zoro</text>
    <text x="12" y="155" class="card-meta">⭐ 4.6 • $15.00</text>
  </g>

  <!-- Footer -->
  <rect x="0" y="1000" width="1200" height="80" fill="#1F2937"/>
  <text x="600" y="1035" text-anchor="middle" class="footer-text">© 2026 CardTrade Market. Todos los derechos reservados.</text>
  <text x="600" y="1055" text-anchor="middle" font-size="12" fill="#6B7280">Términos | Privacidad | Contacto | Ayuda</text>
</svg>
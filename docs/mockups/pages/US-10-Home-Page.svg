    <rect width="240" height="130" rx="12" fill="#FEF3C7"/>
    <text x="120" y="80" text-anchor="middle" font-size="40">🃏</text>
    <text x="120" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#92400E">Pokémon</text>
    <text x="12" y="155" class="card-title">Charizard ex</text>
    <text x="12" y="178" class="card-price">$45.00</text>
  </g>

  <g transform="translate(320, 596)">
    <rect width="240" height="200" rx="12" fill="white" filter="url(#sh)"/>
    <rect width="240" height="130" rx="12" fill="#DBEAFE"/>
    <text x="120" y="80" text-anchor="middle" font-size="40">🃏</text>
    <text x="120" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#1E40AF">Magic</text>
    <text x="12" y="155" class="card-title">Black Lotus</text>
    <text x="12" y="178" class="card-price">$850.00</text>

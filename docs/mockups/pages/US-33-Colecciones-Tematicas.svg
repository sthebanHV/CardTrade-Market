    <text x="150" y="160" text-anchor="middle" font-size="12" fill="#6B7280">7/9 cartas • $12,400</text>
    <text x="150" y="180" text-anchor="middle" font-size="12" fill="#F59E0B">📈 +12% (30d)</text>
    <text x="12" y="205" font-size="11" fill="#6B7280">Black Lotus • Mox Sapphire</text>
    <text x="12" y="220" font-size="11" fill="#6B7280">Mox Jet • Mox Ruby</text>
    <text x="12" y="235" font-size="11" fill="#6B7280">Mox Pearl • Mox Emerald</text>
    <text x="12" y="250" font-size="11" fill="#EF4444">Faltan: Time Walk, Ancestral</text>
    <rect x="50" y="265" width="200" height="36" rx="6" fill="#3B82F6"/>
    <text x="150" y="288" text-anchor="middle" fill="white" font-size="12" font-weight="600">Ver Detalle</text>
  </g>

  <!-- Create New Collection Modal -->
  <rect x="250" y="200" width="700" height="400" rx="16" fill="white" filter="url(#sh)"/>
  <text x="600" y="240" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">CREAR COLECCIÓN TEMÁTICA</text>

  <text x="300" y="280" font-size="13" font-weight="500" fill="#374151">Nombre de la Colección *</text>
  <rect x="300" y="290" width="600" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="320" y="318" fill="#9CA3AF" font-size="14">Ej: Eeveelutions, Legendarios, Shinies</text>

  <text x="300" y="350" font-size="13" font-weight="500" fill="#374151">Descripción</text>
  <rect x="300" y="360" width="600" height="80" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="320" y="390" fill="#9CA3AF" font-size="14">Todas las evoluciones de Eevee en todas las rarezas...</text>

  <text x="300" y="455" font-size="13" font-weight="500" fill="#374151">Icono / Emoji</text>
  <rect x="300" y="465" width="120" height="50" rx="8" fill="#F3F4F6"/>
  <text x="360" y="500" text-anchor="middle" font-size="28">🦊</text>
  <text x="450" y="455" font-size="13" font-weight="500" fill="#374151">Color del tema</text>
  <rect x="450" y="465" width="60" height="50" rx="8" fill="#3B82F6"/>
  <rect x="530" y="465" width="60" height="50" rx="8" fill="#10B981"/>
  <rect x="610" y="465" width="60" height="50" rx="8" fill="#F59E0B"/>
  <rect x="690" y="465" width="60" height="50" rx="8" fill="#A855F7"/>
  <rect x="770" y="465" width="60" height="50" rx="8" fill="#EF4444"/>

  <rect x="300" y="530" width="600" height="44" rx="8" fill="#3B82F6"/>
  <text x="600" y="560" text-anchor="middle" fill="white" font-size="14" font-weight="600">CREAR COLECCIÓN</text>
</svg>
<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <title>Verificacion de Email</title>
  <desc>Wireframe de verificacion de correo electronico con banner de exito, vista previa del correo con boton de verificacion y seccion de reenvio</desc>
  
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .page-title { font-size: 22px; font-weight: 700; fill: #111827; }
    .page-subtitle { font-size: 14px; fill: #6B7280; }
    .section-title { font-size: 18px; font-weight: 700; fill: #111827; }
    .card-title { font-size: 14px; font-weight: 600; fill: #111827; }
    .card-meta { font-size: 12px; fill: #6B7280; }
    .card-price { font-size: 13px; font-weight: 600; fill: #3B82F6; }
    .header-text { font-size: 20px; font-weight: 700; fill: white; }
    .placeholder { font-size: 14px; fill: #9CA3AF; }
    .btn-primary { fill: #3B82F6; }
    .btn-text { font-size: 14px; font-weight: 600; fill: white; }
    .btn-secondary { fill: white; stroke: #D1D5DB; stroke-width: 1.5; }
    .label { font-size: 13px; font-weight: 500; fill: #374151; }
    .input-text { font-size: 14px; fill: #111827; }
    .input-placeholder { font-size: 14px; fill: #9CA3AF; }
    .link { font-size: 13px; fill: #3B82F6; font-weight: 500; }
    .muted { font-size: 14px; fill: #6B7280; }
    .small-muted { font-size: 12px; fill: #6B7280; }
    .hint { font-size: 11px; fill: #6B7280; }
    .footer-text { font-size: 12px; fill: #9CA3AF; }
    .footer-link { font-size: 12px; fill: #6B7280; }
    .stat-text { font-size: 14px; fill: #6B7280; }
    .hero-title { font-size: 32px; font-weight: 700; fill: white; }
    .hero-subtitle { font-size: 18px; fill: rgba(255,255,255,0.85); }
    .tab-active { fill: #3B82F6; }
    .tab-text-active { font-size: 13px; font-weight: 500; fill: white; }
    .tab-text-inactive { font-size: 13px; fill: #6B7280; }
    .info-box { fill: #EFF6FF; stroke: #BFDBFE; stroke-width: 1; }
    .info-text { font-size: 13px; fill: #1E40AF; }
    .info-link { font-size: 12px; fill: #3B82F6; }
  </style>

  <rect width="1200" height="900" fill="#F3F4F6"/>

  <g id="header">
    <rect width="1200" height="64" fill="url(#headerGrad)"/>
    <text x="40" y="42" class="header-text">&#127183; CardTrade Market</text>
  </g>

  <g id="main-content">
    <rect x="60" y="100" width="1080" height="100" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="600" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#065F46">&#10004;&#65039; Correo de Verificaci&#243;n Enviado</text>
    <text x="600" y="165" text-anchor="middle" class="muted" fill="#047857">Hemos enviado un enlace de verificaci&#243;n a cardmaster@email.com</text>

    <rect x="250" y="230" width="700" height="420" rx="12" fill="white" filter="url(#cardShadow)"/>
    <rect x="250" y="230" width="700" height="50" rx="12" fill="#F3F4F6"/>
    <text x="290" y="262" font-size="13" font-weight="600" fill="#374151">&#128231; Vista previa del correo</text>

    <text x="310" y="320" class="input-text" font-weight="600">De: CardTrade Market &lt;noreply@cardtrade.market&gt;</text>
    <text x="310" y="345" class="input-text" font-weight="600">Asunto: Verifica tu correo electr&#243;nico</text>
    <line x1="310" y1="360" x2="890" y2="360" stroke="#E5E7EB" stroke-width="1"/>

    <text x="450" y="400" font-size="18" font-weight="700" fill="#111827">&#127183; CardTrade Market</text>
    <text x="450" y="430" class="input-text">Hola <tspan font-weight="600">CardMaster MX</tspan>,</text>
    <text x="450" y="455" class="input-text">Gracias por registrarte. Haz clic en el bot&#243;n para</text>
    <text x="450" y="475" class="input-text">verificar tu direcci&#243;n de correo electr&#243;nico.</text>

    <rect x="400" y="495" width="300" height="48" rx="8" fill="#3B82F6"/>
    <text x="550" y="525" text-anchor="middle" fill="white" font-size="15" font-weight="600">&#9993;&#65039; VERIFICAR MI CORREO</text>

    <text x="450" y="570" class="small-muted">Si no creaste una cuenta, ignora este mensaje.</text>
    <text x="450" y="590" class="small-muted">El enlace expira en 24 horas.</text>

    <rect x="250" y="680" width="700" height="100" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="600" y="715" text-anchor="middle" class="info-text">&#191;No recibiste el correo?</text>
    <rect x="400" y="730" width="200" height="36" rx="8" fill="#3B82F6"/>
    <text x="500" y="753" text-anchor="middle" fill="white" font-size="13" font-weight="600">Reenviar Correo</text>
  </g>

  <g id="footer">
    <rect x="0" y="820" width="1200" height="80" fill="#1F2937"/>
    <text x="600" y="855" text-anchor="middle" class="footer-text">&#169; 2026 CardTrade Market. Todos los derechos reservados.</text>
    <text x="600" y="875" text-anchor="middle" class="footer-link">T&#233;rminos | Privacidad | Contacto | Ayuda</text>
  </g>
</svg>

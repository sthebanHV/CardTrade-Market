<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <title>Autenticacion 2FA</title>
  <desc>Wireframe de autenticacion de dos factores con codigo QR para escanear, codigo manual y campo de verificacion de 6 digitos</desc>
  
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .page-title { font-size: 22px; font-weight: 700; fill: #111827; }
    .page-subtitle { font-size: 14px; fill: #6B7280; }
    .section-title { font-size: 18px; font-weight: 700; fill: #111827; }
    .card-title { font-size: 14px; font-weight: 600; fill: #111827; }
    .card-meta { font-size: 12px; fill: #6B7280; }
    .card-price { font-size: 13px; font-weight: 600; fill: #3B82F6; }
    .header-text { font-size: 20px; font-weight: 700; fill: white; }
    .placeholder { font-size: 14px; fill: #9CA3AF; }
    .btn-primary { fill: #3B82F6; }
    .btn-text { font-size: 14px; font-weight: 600; fill: white; }
    .btn-secondary { fill: white; stroke: #D1D5DB; stroke-width: 1.5; }
    .label { font-size: 13px; font-weight: 500; fill: #374151; }
    .input-text { font-size: 14px; fill: #111827; }
    .input-placeholder { font-size: 14px; fill: #9CA3AF; }
    .link { font-size: 13px; fill: #3B82F6; font-weight: 500; }
    .muted { font-size: 14px; fill: #6B7280; }
    .small-muted { font-size: 12px; fill: #6B7280; }
    .hint { font-size: 11px; fill: #6B7280; }
    .footer-text { font-size: 12px; fill: #9CA3AF; }
    .footer-link { font-size: 12px; fill: #6B7280; }
    .stat-text { font-size: 14px; fill: #6B7280; }
    .hero-title { font-size: 32px; font-weight: 700; fill: white; }
    .hero-subtitle { font-size: 18px; fill: rgba(255,255,255,0.85); }
    .tab-active { fill: #3B82F6; }
    .tab-text-active { font-size: 13px; font-weight: 500; fill: white; }
    .tab-text-inactive { font-size: 13px; fill: #6B7280; }
    .info-box { fill: #EFF6FF; stroke: #BFDBFE; stroke-width: 1; }
    .info-text { font-size: 13px; fill: #1E40AF; }
    .info-link { font-size: 12px; fill: #3B82F6; }
  </style>

  <rect width="1200" height="900" fill="#F3F4F6"/>

  <g id="header">
    <rect width="1200" height="64" fill="url(#headerGrad)"/>
    <text x="40" y="42" class="header-text">&#127183; CardTrade Market</text>
  </g>

  <g id="main-content">
    <rect x="350" y="120" width="500" height="600" rx="12" fill="white" filter="url(#cardShadow)"/>
    <text x="600" y="170" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">AUTENTICACI&#211;N DE DOS FACTORES</text>
    <text x="600" y="195" text-anchor="middle" class="muted">Escanea el c&#243;digo QR con tu app de autenticaci&#243;n</text>

    <rect x="450" y="220" width="300" height="300" rx="12" fill="white" stroke="#D1D5DB" stroke-width="2"/>
    <g transform="translate(480, 250)">
      <rect width="240" height="240" fill="white"/>
      <rect x="10" y="10" width="60" height="60" rx="4" fill="#111827"/>
      <rect x="20" y="20" width="40" height="40" rx="2" fill="white"/>
      <rect x="28" y="28" width="24" height="24" rx="2" fill="#111827"/>
      <rect x="170" y="10" width="60" height="60" rx="4" fill="#111827"/>
      <rect x="180" y="20" width="40" height="40" rx="2" fill="white"/>
      <rect x="188" y="28" width="24" height="24" rx="2" fill="#111827"/>
      <rect x="10" y="170" width="60" height="60" rx="4" fill="#111827"/>
      <rect x="20" y="180" width="40" height="40" rx="2" fill="white"/>
      <rect x="28" y="188" width="24" height="24" rx="2" fill="#111827"/>
      <rect x="80" y="10" width="20" height="20" fill="#111827"/>
      <rect x="110" y="30" width="20" height="20" fill="#111827"/>
      <rect x="140" y="10" width="20" height="20" fill="#111827"/>
      <rect x="80" y="60" width="20" height="20" fill="#111827"/>
      <rect x="120" y="80" width="20" height="20" fill="#111827"/>
      <rect x="80" y="100" width="40" height="20" fill="#111827"/>
      <rect x="140" y="100" width="20" height="20" fill="#111827"/>
      <rect x="80" y="140" width="20" height="20" fill="#111827"/>
      <rect x="110" y="160" width="20" height="20" fill="#111827"/>
      <rect x="140" y="140" width="20" height="20" fill="#111827"/>
      <rect x="170" y="80" width="20" height="20" fill="#111827"/>
      <rect x="200" y="100" width="20" height="20" fill="#111827"/>
      <rect x="170" y="120" width="40" height="20" fill="#111827"/>
      <rect x="100" y="180" width="20" height="20" fill="#111827"/>
      <rect x="140" y="180" width="20" height="20" fill="#111827"/>
      <rect x="170" y="170" width="60" height="60" rx="4" fill="#111827"/>
      <rect x="180" y="180" width="40" height="40" rx="2" fill="white"/>
      <rect x="188" y="188" width="24" height="24" rx="2" fill="#111827"/>
    </g>

    <text x="600" y="545" text-anchor="middle" class="muted">O ingresa el c&#243;digo manualmente:</text>
    <rect x="400" y="555" width="400" height="40" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
    <text x="600" y="580" text-anchor="middle" font-size="16" font-weight="600" fill="#111827" font-family="monospace">JBSWY3DPEHPK3PXP</text>

    <text x="600" y="620" text-anchor="middle" class="muted">Ingresa el c&#243;digo de 6 d&#237;gitos de tu app:</text>
    <g transform="translate(430, 635)">
      <rect width="44" height="52" rx="8" fill="white" stroke="#3B82F6" stroke-width="2"/>
      <text x="22" y="35" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">4</text>
      <rect x="56" width="44" height="52" rx="8" fill="white" stroke="#3B82F6" stroke-width="2"/>
      <text x="78" y="35" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">7</text>
      <rect x="112" width="44" height="52" rx="8" fill="white" stroke="#3B82F6" stroke-width="2"/>
      <text x="134" y="35" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">2</text>
      <rect x="176" width="44" height="52" rx="8" fill="white" stroke="#D1D5DB" stroke-width="2"/>
      <rect x="232" width="44" height="52" rx="8" fill="white" stroke="#D1D5DB" stroke-width="2"/>
      <rect x="288" width="44" height="52" rx="8" fill="white" stroke="#D1D5DB" stroke-width="2"/>
    </g>

    <rect x="400" y="710" width="400" height="48" rx="8" fill="#3B82F6"/>
    <text x="600" y="740" text-anchor="middle" fill="white" font-size="15" font-weight="600">VERIFICAR Y ACTIVAR</text>

    <text x="600" y="785" text-anchor="middle" class="muted">Guarda estos c&#243;digos de respaldo en un lugar seguro</text>
  </g>

  <g id="footer">
    <rect x="0" y="820" width="1200" height="80" fill="#1F2937"/>
    <text x="600" y="855" text-anchor="middle" class="footer-text">&#169; 2026 CardTrade Market. Todos los derechos reservados.</text>
    <text x="600" y="875" text-anchor="middle" class="footer-link">T&#233;rminos | Privacidad | Contacto | Ayuda</text>
  </g>
</svg>

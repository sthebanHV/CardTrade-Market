<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <title>Detalle de Carta</title>
  <desc>Wireframe de pagina de detalle de carta con imagen, informacion, acciones y resenas del vendedor</desc>
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cardShadow"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .page-title{font-size:24px;font-weight:700;fill:#111827}
    .section-title{font-size:16px;font-weight:700;fill:#111827}
    .card-title{font-size:14px;font-weight:600;fill:#111827}
    .card-meta{font-size:12px;fill:#6B7280}
    .card-price{font-size:14px;font-weight:700;fill:#3B82F6}
    .header-text{font-size:20px;font-weight:700;fill:white}
    .btn-text{font-size:14px;font-weight:600;fill:white}
    .label{font-size:13px;font-weight:500;fill:#374151}
    .input-text{font-size:14px;fill:#111827}
    .muted{font-size:14px;fill:#6B7280}
    .small-muted{font-size:12px;fill:#6B7280}
    .link{font-size:13px;fill:#3B82F6;font-weight:500}
    .footer-text{font-size:12px;fill:#9CA3AF}
    .footer-link{font-size:12px;fill:#6B7280}
  </style>
  <rect width="1200" height="900" fill="#F3F4F6"/>
  <g id="header">
    <rect width="1200" height="64" fill="url(#headerGrad)"/>
    <text x="40" y="42" class="header-text">&#x1F0CF; CardTrade Market</text>
  </g>
  <g id="main-content">
    <text x="60" y="100" class="small-muted">Inicio / Pokemon / Charizard ex</text>
    <rect x="60" y="120" width="350" height="500" rx="16" fill="#FEF3C7"/>
    <text x="235" y="350" text-anchor="middle" font-size="120">&#x1F0CF;</text>
    <text x="235" y="420" text-anchor="middle" class="card-title" fill="#92400E">Pokemon TCG</text>
    <rect x="440" y="120" width="700" height="500" rx="16" fill="white" filter="url(#cardShadow)"/>
    <text x="480" y="170" class="link" text-transform="uppercase">POKEMON TCG</text>
    <text x="480" y="200" class="page-title">Charizard ex 199/165</text>
    <text x="480" y="225" class="muted">Obsidian Flames &#x2022; Ultra Rare</text>
    <rect x="480" y="245" width="200" height="60" rx="8" fill="#EFF6FF"/>
    <text x="500" y="280" font-size="28" font-weight="700" fill="#1E40AF">$45.00</text>
    <rect x="720" y="245" width="400" height="60" rx="8" fill="#F3F4F6"/>
    <circle cx="755" cy="275" r="20" fill="#3B82F6"/>
    <text x="755" y="280" text-anchor="middle" fill="white" font-size="12" font-weight="600">CM</text>
    <text x="790" y="268" class="card-title">CardMaster MX</text>
    <text x="790" y="288" class="card-meta">&#x2B50; 4.8 (125 resenas) &#x2022; 342 ventas</text>
    <line x1="480" y1="330" x2="1100" y2="330" stroke="#E5E7EB" stroke-width="1"/>
    <text x="480" y="365" class="label">Detalles</text>
    <text x="480" y="390" class="small-muted">Juego:</text>
    <text x="560" y="390" class="input-text">Pokemon TCG</text>
    <text x="480" y="415" class="small-muted">Set:</text>
    <text x="560" y="415" class="input-text">Obsidian Flames</text>
    <text x="480" y="440" class="small-muted">Numero:</text>
    <text x="560" y="440" class="input-text">199/165</text>
    <text x="480" y="465" class="small-muted">Rareza:</text>
    <text x="560" y="465" class="input-text">Ultra Rare</text>
    <text x="480" y="490" class="small-muted">Estado:</text>
    <text x="560" y="490" class="input-text">Nuevo (Sellado)</text>
    <text x="480" y="515" class="small-muted">Envio:</text>
    <text x="560" y="515" class="input-text">Gratis (Mexico)</text>
    <rect x="480" y="545" width="300" height="48" rx="8" fill="#3B82F6"/>
    <text x="630" y="575" text-anchor="middle" fill="white" font-size="15" font-weight="600">&#x1F6D2; AGREGAR AL CARRITO</text>
    <rect x="800" y="545" width="140" height="48" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="870" y="575" text-anchor="middle" class="muted">&#x2661; Favorito</text>
    <rect x="960" y="545" width="140" height="48" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="1030" y="575" text-anchor="middle" class="muted">&#x1F4E4; Compartir</text>
    <text x="480" y="640" class="label">Descripcion</text>
    <text x="480" y="665" class="muted">Carta en excelente estado, perfecta para coleccionistas. Envio con tracking incluido.</text>
    <text x="480" y="685" class="muted">Se vende con protector y sobre grade.</text>
    <rect x="60" y="650" width="1080" height="200" rx="12" fill="white" filter="url(#cardShadow)"/>
    <text x="80" y="690" class="section-title">RESENAS DEL VENDEDOR</text>
    <circle cx="100" cy="730" r="20" fill="#10B981"/>
    <text x="100" y="735" text-anchor="middle" fill="white" font-size="12" font-weight="600">JD</text>
    <text x="130" y="725" class="label">Juan D.</text>
    <text x="130" y="745" class="card-meta">&#x2B50;&#x2B50;&#x2B50;&#x2B50;&#x2B50; &#x2022; Hace 2 dias</text>
    <text x="130" y="765" class="label">Excelente vendedor, cartas en perfecto estado.</text>
  </g>
  <g id="footer">
    <rect x="0" y="820" width="1200" height="80" fill="#1F2937"/>
    <text x="600" y="855" text-anchor="middle" class="footer-text">&#xA9; 2026 CardTrade Market. Todos los derechos reservados.</text>
    <text x="600" y="875" text-anchor="middle" class="footer-link">Terminos | Privacidad | Contacto | Ayuda</text>
  </g>
</svg>
<svg viewBox="0 0 1200 960" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 12px; fill: #6B7280; }
    .contact-name { font-size: 14px; font-weight: 600; fill: #111827; }
    .contact-preview { font-size: 12px; fill: #6B7280; }
    .contact-time { font-size: 11px; fill: #9CA3AF; }
    .chat-title { font-size: 16px; font-weight: 600; fill: #111827; }
    .chat-status { font-size: 12px; fill: #10B981; }
    .message-other { font-size: 13px; fill: #111827; }
    .message-time { font-size: 11px; fill: #9CA3AF; }
    .message-own { font-size: 13px; fill: white; }
    .image-label { font-size: 13px; fill: #111827; }
    .input-placeholder { font-size: 14px; fill: #9CA3AF; }
    .btn-icon { font-size: 14px; fill: white; }
  </style>

  <rect width="1200" height="960" fill="#F3F4F6"/>
  <rect width="1200" height="64" fill="url(#hg)"/>
  <text x="40" y="42" font-size="20" font-weight="700" fill="white">🃏 CardTrade Market</text>

  <!-- Chat List Sidebar -->
  <rect x="60" y="84" width="380" height="840" rx="12" fill="white" filter="url(#sh)"/>
  <text x="80" y="120" font-size="18" font-weight="700" fill="#111827">MENSAJES</text>
  <text x="380" y="120" font-size="12" fill="#6B7280">3 nuevos</text>

  <g transform="translate(80, 150)">
    <circle cx="35" cy="35" r="30" fill="#3B82F6"/>
    <text x="35" y="41" text-anchor="middle" fill="white" font-size="14" font-weight="700">CM</text>
    <text x="80" y="30" class="contact-name">CardMaster MX</text>
    <text x="80" y="50" class="contact-preview">¿Te interesa el Charizard?</text>
    <text x="300" y="30" class="contact-time">10:32</text>
    <circle cx="340" cy="20" r="8" fill="#EF4444"/>
    <text x="340" y="24" text-anchor="middle" fill="white" font-size="9" font-weight="700">2</text>
  </g>

  <g transform="translate(80, 230)">
    <circle cx="35" cy="35" r="30" fill="#10B981"/>
    <text x="35" y="41" text-anchor="middle" fill="white" font-size="14" font-weight="700">PF</text>
    <text x="80" y="30" class="contact-name">PikaFan99</text>
    <text x="80" y="50" class="contact-preview">Hola! El Pikachu VMAX sigue disponible</text>
    <text x="300" y="30" class="contact-time">09:15</text>
    <circle cx="340" cy="20" r="8" fill="#EF4444"/>
    <text x="340" y="24" text-anchor="middle" fill="white" font-size="9" font-weight="700">1</text>
  </g>

  <g transform="translate(80, 310)">
    <circle cx="35" cy="35" r="30" fill="#F59E0B"/>
    <text x="35" y="41" text-anchor="middle" fill="white" font-size="14" font-weight="700">CP</text>
    <text x="80" y="30" class="contact-name">CollectorPro</text>
    <text x="80" y="50" class="contact-preview">Black Lotus - Envío confirmado</text>
    <text x="300" y="30" class="contact-time">Ayer</text>
  </g>

  <g transform="translate(80, 390)">
    <circle cx="35" cy="35" r="30" fill="#A855F7"/>
    <text x="35" y="41" text-anchor="middle" fill="white" font-size="14" font-weight="700">YG</text>
    <text x="80" y="30" class="contact-name">YugiMaster</text>
    <text x="80" y="50" class="contact-preview">¿Tienes más Blue-Eyes?</text>
    <text x="300" y="30" class="contact-time">Ayer</text>
  </g>

  <!-- Chat Area -->
  <rect x="460" y="84" width="680" height="840" rx="12" fill="white" filter="url(#sh)"/>

  <!-- Chat Header -->
  <rect x="460" y="84" width="680" height="70" rx="12" fill="#F3F4F6"/>
  <circle cx="490" cy="119" r="25" fill="#3B82F6"/>
  <text x="490" y="125" text-anchor="middle" fill="white" font-size="12" font-weight="700">CM</text>
  <text x="530" y="110" class="chat-title">CardMaster MX</text>
  <text x="530" y="130" class="chat-status">● En línea</text>
  <rect x="1050" y="100" width="60" height="36" rx="6" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="1080" y="123" text-anchor="middle" font-size="11" fill="#6B7280">📞</text>
  <rect x="1050" y="100" width="60" height="36" rx="6" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="1080" y="123" text-anchor="middle" font-size="11" fill="#6B7280">📹</text>
  <rect x="1120" y="100" width="60" height="36" rx="6" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="1150" y="123" text-anchor="middle" font-size="11" fill="#6B7280">⋮</text>

  <!-- Messages -->
  <rect x="460" y="154" width="680" height="610" rx="12" fill="#F9FAFB"/>
  
  <g transform="translate(480, 170)">
    <circle cx="20" cy="20" r="18" fill="#3B82F6"/>
    <text x="20" y="25" text-anchor="middle" fill="white" font-size="10" font-weight="700">CM</text>
    <rect x="50" y="5" width="280" height="60" rx="12" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <text x="60" y="30" font-size="13" fill="#111827">¡Hola! Sí, el Charizard ex sigue disponible</text>
    <text x="60" y="50" font-size="11" fill="#9CA3AF">10:30</text>
  </g>

  <g transform="translate(480, 255)">
    <rect x="350" y="5" width="280" height="60" rx="12" fill="#3B82F6"/>
    <text x="360" y="30" font-size="13" fill="white">¿Incluye funda y sobre grade?</text>
    <text x="610" y="50" font-size="11" fill="#9CA3AF">10:31</text>
  </g>

  <g transform="translate(480, 340)">
    <circle cx="20" cy="20" r="18" fill="#3B82F6"/>
    <text x="20" y="25" text-anchor="middle" fill="white" font-size="10" font-weight="700">CM</text>
    <rect x="50" y="5" width="280" height="60" rx="12" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <text x="60" y="30" font-size="13" fill="#111827">Sí, va con funda perfect fit y sobre toploader</text>
    <text x="60" y="50" font-size="11" fill="#9CA3AF">10:32</text>
  </g>

  <g transform="translate(480, 430)">
    <circle cx="20" cy="20" r="18" fill="#3B82F6"/>
    <text x="20" y="25" text-anchor="middle" fill="white" font-size="10" font-weight="700">CM</text>
    <rect x="50" y="5" width="280" height="85" rx="12" fill="#FEF3C7"/>
    <text x="60" y="30" class="image-label">📷 Foto del estado actual</text>
    <rect x="100" y="35" width="160" height="100" rx="8" fill="#FEF3C7"/>
    <text x="180" y="95" text-anchor="middle" font-size="36">🃏</text>
    <text x="60" y="75" font-size="11" fill="#9CA3AF">10:33</text>
  </g>

  <g transform="translate(480, 540)">
    <rect x="350" y="5" width="280" height="60" rx="12" fill="#3B82F6"/>
    <text x="360" y="30" font-size="13" fill="white">Perfecto! ¿Envío gratis a CDMX?</text>
    <text x="610" y="50" font-size="11" fill="#9CA3AF">10:34</text>
  </g>

  <g transform="translate(480, 625)">
    <circle cx="20" cy="20" r="18" fill="#3B82F6"/>
    <text x="20" y="25" text-anchor="middle" fill="white" font-size="10" font-weight="700">CM</text>
    <rect x="50" y="5" width="280" height="60" rx="12" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <text x="60" y="30" font-size="13" fill="#111827">Sí, envío gratis por Estafeta con tracking</text>
    <text x="60" y="50" font-size="11" fill="#9CA3AF">10:35</text>
  </g>

  <!-- Input Area -->
  <rect x="460" y="764" width="680" height="90" rx="12" fill="#F3F4F6"/>
  <rect x="480" y="784" width="520" height="44" rx="22" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="500" y="810" class="input-placeholder">Escribe un mensaje...</text>
  <circle cx="1030" cy="806" r="22" fill="#3B82F6"/>
  <text x="1030" y="812" text-anchor="middle" class="btn-icon">📷</text>
  <circle cx="1070" cy="806" r="22" fill="#3B82F6"/>
  <text x="1070" y="812" text-anchor="middle" class="btn-icon">📎</text>
  <circle cx="1110" cy="806" r="22" fill="#3B82F6"/>
  <text x="1110" y="812" text-anchor="middle" class="btn-icon">➤</text>
</svg>
<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <title>Perfil de Vendedor</title>
  <desc>Wireframe de pagina de perfil de vendedor con informacion, estadisticas y publicaciones activas</desc>
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cardShadow"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .page-title{font-size:24px;font-weight:700;fill:#111827}
    .section-title{font-size:16px;font-weight:700;fill:#111827}
    .card-title{font-size:14px;font-weight:600;fill:#111827}
    .card-meta{font-size:12px;fill:#6B7280}
    .header-text{font-size:20px;font-weight:700;fill:white}
    .label{font-size:13px;font-weight:500;fill:#374151}
    .input-text{font-size:14px;fill:#111827}
    .muted{font-size:14px;fill:#6B7280}
    .small-muted{font-size:12px;fill:#6B7280}
    .link{font-size:13px;fill:#3B82F6;font-weight:500}
    .footer-text{font-size:12px;fill:#9CA3AF}
    .footer-link{font-size:12px;fill:#6B7280}
  </style>
  <rect width="1200" height="900" fill="#F3F4F6"/>
  <g id="header">
    <rect width="1200" height="64" fill="url(#headerGrad)"/>
    <text x="40" y="42" class="header-text">&#x1F0CF; CardTrade Market</text>
  </g>
  <g id="main-content">
    <text x="60" y="100" class="small-muted">Inicio / Vendedor / CardMaster MX</text>
    <rect x="60" y="120" width="1080" height="180" rx="16" fill="white" filter="url(#cardShadow)"/>
    <circle cx="160" cy="210" r="60" fill="#3B82F6"/>
    <text x="160" y="218" text-anchor="middle" fill="white" font-size="32" font-weight="700">CM</text>
    <text x="250" y="180" class="page-title">CardMaster MX</text>
    <text x="250" y="205" class="muted">&#x1F4CD; Ciudad de Mexico, Mexico</text>
    <text x="250" y="225" class="label">Miembro desde Enero 2024</text>
    <text x="250" y="245" font-size="16" font-weight="600" fill="#111827">&#x2B50; 4.8 (125 resenas)</text>
    <rect x="900" y="160" width="180" height="44" rx="8" fill="#3B82F6"/>
    <text x="990" y="188" text-anchor="middle" fill="white" font-size="14" font-weight="600">&#x1F4AC; Contactar</text>
    <rect x="900" y="215" width="180" height="44" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="990" y="243" text-anchor="middle" class="muted">&#x1F514; Seguir</text>
    <g transform="translate(480,160)">
      <rect width="120" height="120" rx="12" fill="#EFF6FF"/>
      <text x="60" y="45" text-anchor="middle" font-size="28" font-weight="700" fill="#1E40AF">342</text>
      <text x="60" y="70" text-anchor="middle" class="small-muted" fill="#3B82F6">Ventas Totales</text>
    </g>
    <g transform="translate(620,160)">
      <rect width="120" height="120" rx="12" fill="#ECFDF5"/>
      <text x="60" y="45" text-anchor="middle" font-size="28" font-weight="700" fill="#059669">99.2%</text>
      <text x="60" y="70" text-anchor="middle" class="small-muted" fill="#10B981">Tasa de Exito</text>
    </g>
    <g transform="translate(760,160)">
      <rect width="120" height="120" rx="12" fill="#FEF3C7"/>
      <text x="60" y="45" text-anchor="middle" font-size="28" font-weight="700" fill="#D97706">2.3h</text>
      <text x="60" y="70" text-anchor="middle" class="small-muted" fill="#F59E0B">Tiempo Resp. Prom.</text>
    </g>
    <g transform="translate(900,160)">
      <rect width="120" height="120" rx="12" fill="#F3E8FF"/>
      <text x="60" y="45" text-anchor="middle" font-size="28" font-weight="700" fill="#9333EA">89</text>
      <text x="60" y="70" text-anchor="middle" class="small-muted" fill="#A855F7">Seguidores</text>
    </g>
    <rect x="60" y="320" width="500" height="200" rx="12" fill="white" filter="url(#cardShadow)"/>
    <text x="80" y="355" class="section-title">SOBRE EL VENDEDOR</text>
    <text x="80" y="385" class="input-text">Coleccionista de Pokemon desde 2005. Especialista en cartas vintage y grading. Todos mis envios incluyen tracking y seguro.</text>
    <text x="80" y="415" class="input-text">Especialidades: Pokemon TCG Base Set, 1st Edition, Cartas Graded PSA/BGS</text>
    <rect x="60" y="540" width="500" height="200" rx="12" fill="white" filter="url(#cardShadow)"/>
    <text x="80" y="575" class="section-title">POLITICAS DE ENVIO</text>
    <text x="80" y="605" class="label">&#x1F4E6; Envio gratis en compras &gt; MXN</text>
    <text x="80" y="625" class="label">&#x1F69A; Envio estandar:  MXN (2-5 dias)</text>
    <text x="80" y="645" class="label">&#x26A1; Envio express:  MXN (24-48h)</text>
    <text x="80" y="665" class="label">&#x1F6E1;&#xFE0F; Seguro incluido en todos los envios</text>
    <text x="80" y="685" class="label">&#x1F4F8; Fotos del paquete antes de enviar</text>
    <rect x="590" y="320" width="550" height="420" rx="12" fill="white" filter="url(#cardShadow)"/>
    <text x="610" y="355" class="section-title">PUBLICACIONES ACTIVAS (8)</text>
    <g transform="translate(610,370)">
      <rect width="510" height="80" rx="8" fill="#F3F4F6"/>
      <rect x="10" y="10" width="60" height="60" rx="8" fill="#FEF3C7"/>
      <text x="40" y="48" text-anchor="middle" font-size="24">&#x1F0CF;</text>
      <text x="90" y="35" class="label">Charizard ex</text>
      <text x="90" y="55" class="card-meta">.00 &#x2022; 23 vistas</text>
      <rect x="420" y="20" width="80" height="30" rx="15" fill="#D1FAE5"/>
      <text x="460" y="38" text-anchor="middle" fill="#065F46" font-size="11" font-weight="600">ACTIVA</text>
    </g>
    <g transform="translate(610,465)">
      <rect width="510" height="80" rx="8" fill="#F3F4F6"/>
      <rect x="10" y="10" width="60" height="60" rx="8" fill="#DBEAFE"/>
      <text x="40" y="48" text-anchor="middle" font-size="24">&#x1F0CF;</text>
      <text x="90" y="35" class="label">Pikachu VMAX</text>
      <text x="90" y="55" class="card-meta">.00 &#x2022; 45 vistas</text>
      <rect x="420" y="20" width="80" height="30" rx="15" fill="#D1FAE5"/>
      <text x="460" y="38" text-anchor="middle" fill="#065F46" font-size="11" font-weight="600">ACTIVA</text>
    </g>
    <g transform="translate(610,560)">
      <rect width="510" height="80" rx="8" fill="#F3F4F6"/>
      <rect x="10" y="10" width="60" height="60" rx="8" fill="#FEF3C7"/>
      <text x="40" y="48" text-anchor="middle" font-size="24">&#x1F0CF;</text>
      <text x="90" y="35" class="label">Rayquaza VMAX</text>
      <text x="90" y="55" class="card-meta">.00 &#x2022; 12 vistas</text>
      <rect x="420" y="20" width="80" height="30" rx="15" fill="#D1FAE5"/>
      <text x="460" y="38" text-anchor="middle" fill="#065F46" font-size="11" font-weight="600">ACTIVA</text>
    </g>
    <g transform="translate(610,655)">
      <rect width="510" height="80" rx="8" fill="#F3F4F6"/>
      <rect x="10" y="10" width="60" height="60" rx="8" fill="#FCE7F3"/>
      <text x="40" y="48" text-anchor="middle" font-size="24">&#x1F0CF;</text>
      <text x="90" y="35" class="label">Umbreon VMAX</text>
      <text x="90" y="55" class="card-meta">.00 &#x2022; 8 vistas</text>
      <rect x="420" y="20" width="80" height="30" rx="15" fill="#D1FAE5"/>
      <text x="460" y="38" text-anchor="middle" fill="#065F46" font-size="11" font-weight="600">ACTIVA</text>
    </g>
  </g>
  <g id="footer">
    <rect x="0" y="820" width="1200" height="80" fill="#1F2937"/>
    <text x="600" y="855" text-anchor="middle" class="footer-text">&#xA9; 2026 CardTrade Market. Todos los derechos reservados.</text>
    <text x="600" y="875" text-anchor="middle" class="footer-link">Terminos | Privacidad | Contacto | Ayuda</text>
  </g>
</svg>
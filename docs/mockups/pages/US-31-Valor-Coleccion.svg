<svg viewBox="0 0 1200 960" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .title { font-size: 24px; font-weight: 700; fill: #111827; }
    .section-title { font-size: 18px; font-weight: 700; fill: #111827; }
    .stat-value { font-size: 36px; font-weight: 700; }
    .stat-label { font-size: 14px; fill: #6B7280; }
    .stat-delta { font-size: 12px; }
    .chart-title { font-size: 18px; font-weight: 700; fill: #111827; }
    .chart-placeholder { font-size: 16px; fill: #9CA3AF; }
    .chart-note { font-size: 12px; fill: #9CA3AF; }
    .breakdown-title { font-size: 18px; font-weight: 700; fill: #111827; }
    .breakdown-item { font-size: 14px; fill: #111827; }
    .breakdown-value { font-size: 14px; font-weight: 600; }
    .top-title { font-size: 18px; font-weight: 700; fill: #111827; }
    .top-item { font-size: 13px; font-weight: 600; fill: #111827; }
    .top-price { font-size: 14px; font-weight: 600; fill: #3B82F6; }
  </style>

  <rect width="1200" height="960" fill="#F3F4F6"/>
  <rect width="1200" height="64" fill="url(#hg)"/>
  <text x="40" y="42" font-size="20" font-weight="700" fill="white">🃏 CardTrade Market</text>

  <text x="60" y="110" class="title">VALOR Y ESTADÍSTICAS DE COLECCIÓN</text>

  <!-- Main Stats -->
  <g transform="translate(60, 140)">
    <rect width="260" height="150" rx="16" fill="white" filter="url(#sh)"/>
    <text x="130" y="180" text-anchor="middle" class="stat-value" fill="#3B82F6">$12,450</text>
    <text x="130" y="210" text-anchor="middle" class="stat-label">Valor Total Estimado</text>
    <text x="130" y="230" text-anchor="middle" class="stat-delta" fill="#10B981">📈 +15.2% (30 días)</text>
  </g>

  <g transform="translate(340, 140)">
    <rect width="260" height="150" rx="16" fill="white" filter="url(#sh)"/>
    <text x="130" y="180" text-anchor="middle" class="stat-value" fill="#10B981">127</text>
    <text x="130" y="210" text-anchor="middle" class="stat-label">Cartas Totales</text>
    <text x="130" y="230" text-anchor="middle" class="stat-delta" fill="#3B82F6">89 Pokémon • 28 Magic</text>
  </g>

  <g transform="translate(620, 140)">
    <rect width="260" height="150" rx="16" fill="white" filter="url(#sh)"/>
    <text x="130" y="180" text-anchor="middle" class="stat-value" fill="#F59E0B">15</text>
    <text x="130" y="210" text-anchor="middle" class="stat-label">Cartas Graded</text>
    <text x="130" y="230" text-anchor="middle" class="stat-delta" fill="#10B981">PSA: 8 • BGS: 5 • CGC: 2</text>
  </g>

  <g transform="translate(900, 140)">
    <rect width="260" height="150" rx="16" fill="white" filter="url(#sh)"/>
    <text x="130" y="180" text-anchor="middle" class="stat-value" fill="#A855F7">3</text>
    <text x="130" y="210" text-anchor="middle" class="stat-label">Sets Completos</text>
    <text x="130" y="230" text-anchor="middle" class="stat-delta" fill="#A855F7">Base, Jungle, Fossil</text>
  </g>

  <!-- Value Chart Placeholder -->
  <rect x="60" y="320" width="1080" height="320" rx="16" fill="white" filter="url(#sh)"/>
  <text x="100" y="360" class="chart-title">EVOLUCIÓN DEL VALOR (12 MESES)</text>
  <rect x="100" y="380" width="1000" height="240" fill="#F3F4F6" rx="8"/>
  <text x="600" y="510" text-anchor="middle" class="chart-placeholder">📈 Gráfica de línea: $8,200 → $12,450</text>
  <text x="600" y="530" text-anchor="middle" class="chart-placeholder">Picos: Marzo (Charizard Base PSA 9) • Agosto (Black Lotus)</text>

  <!-- Breakdown by Game -->
  <rect x="60" y="650" width="520" height="260" rx="16" fill="white" filter="url(#sh)"/>
  <text x="100" y="690" class="breakdown-title">VALOR POR JUEGO</text>
  
  <text x="100" y="725" class="breakdown-item">Pokémon TCG</text>
  <text x="480" y="725" text-anchor="end" class="breakdown-value" fill="#3B82F6">$8,950 (71.9%)</text>
  <rect x="100" y="730" width="380" height="8" rx="4" fill="#DBEAFE"/>
  <rect x="100" y="730" width="273" height="8" rx="4" fill="#3B82F6"/>

  <text x="100" y="755" class="breakdown-item">Magic: The Gathering</text>
  <text x="480" y="755" text-anchor="end" class="breakdown-value" fill="#F59E0B">$2,800 (22.5%)</text>
  <rect x="100" y="760" width="380" height="8" rx="4" fill="#FEF3C7"/>
  <rect x="100" y="760" width="85" height="8" rx="4" fill="#F59E0B"/>

  <text x="100" y="785" class="breakdown-item">Yu-Gi-Oh!</text>
  <text x="480" y="785" text-anchor="end" class="breakdown-value" fill="#A855F7">$700 (5.6%)</text>
  <rect x="100" y="790" width="380" height="8" rx="4" fill="#F3E8FF"/>
  <rect x="100" y="790" width="21" height="8" rx="4" fill="#A855F7"/>

  <!-- Top Cards -->
  <rect x="600" y="650" width="540" height="260" rx="16" fill="white" filter="url(#sh)"/>
  <text x="640" y="690" class="top-title">TOP 5 CARTAS MÁS VALIOSAS</text>

  <g transform="translate(640, 705)">
    <text y="20" class="top-item">1. Black Lotus (Beta) - PSA 9</text>
    <text y="20" x="400" text-anchor="end" class="top-price">$8,500</text>
  </g>
  <g transform="translate(640, 740)">
    <text y="20" class="top-item">2. Charizard 1st Ed. (Base) - PSA 9</text>
    <text y="20" x="400" text-anchor="end" class="top-price">$3,200</text>
  </g>
  <g transform="translate(640, 775)">
    <text y="20" class="top-item">3. Mox Sapphire (Unlimited) - BGS 9</text>
    <text y="20" x="400" text-anchor="end" class="top-price">$450</text>
  </g>
  <g transform="translate(640, 810)">
    <text y="20" class="top-item">4. Charizard VMAX (Evolving) - PSA 10</text>
    <text y="20" x="400" text-anchor="end" class="top-price">$320</text>
  </g>
  <g transform="translate(640, 845)">
    <text y="20" class="top-item">5. Time Walk (Unlimited) - CGC 9.5</text>
    <text y="20" x="400" text-anchor="end" class="top-price">$280</text>
  </g>
</svg>
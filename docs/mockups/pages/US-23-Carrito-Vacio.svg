<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>text { font-family: 'Inter', sans-serif; }</style>
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E40AF"/><stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1200" height="900" fill="#F3F4F6"/>
  <rect width="1200" height="64" fill="url(#hg)"/>
  <text x="40" y="40" fill="white" font-size="20" font-weight="700">🃏 CardTrade Market</text>

  <!-- Empty Cart -->
  <rect x="350" y="200" width="500" height="450" rx="16" fill="white" filter="url(#sh)"/>
  <circle cx="600" cy="300" r="60" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="600" y="310" text-anchor="middle" font-size="48">🛒</text>
  <text x="600" y="380" text-anchor="middle" font-size="22" font-weight="600" fill="#111827">Tu carrito está vacío</text>
  <text x="600" y="410" text-anchor="middle" font-size="14" fill="#6B7280">Agrega cartas increíbles a tu carrito</text>
  <text x="600" y="430" text-anchor="middle" font-size="14" fill="#6B7280">y procede al pago cuando estés listo</text>
  <rect x="450" y="460" width="300" height="48" rx="8" fill="#3B82F6"/>
  <text x="600" y="490" text-anchor="middle" fill="white" font-size="15" font-weight="600">EXPLORAR CARTAS</text>
</svg>
<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <title>Carrito Vacio</title>
  <desc>Vista de carrito de compras sin articulos</desc>
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cardShadow"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .header-text{font-size:20px;font-weight:700;fill:white}
    .empty-title{font-size:22px;font-weight:600;fill:#111827}
    .empty-desc{font-size:14px;fill:#6B7280}
    .btn-primary{font-size:15px;font-weight:600;fill:white}
    .footer-text{font-size:12px;fill:#9CA3AF}
    .footer-link{font-size:12px;fill:#6B7280}
  </style>
  <rect width="1200" height="800" fill="#F3F4F6"/>

  <g id="header">
    <rect width="1200" height="64" fill="url(#headerGrad)"/>
    <text x="40" y="42" class="header-text">&#x1F0CF; CardTrade Market</text>
  </g>

  <g id="main-content">
    <rect x="300" y="150" width="600" height="450" rx="16" fill="white" filter="url(#cardShadow)"/>
    <circle cx="600" cy="270" r="60" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="600" y="282" text-anchor="middle" font-size="48">&#x1F6D2;</text>
    <text x="600" y="370" text-anchor="middle" class="empty-title">Tu carrito esta vacio</text>
    <text x="600" y="405" text-anchor="middle" class="empty-desc">Agrega cartas increibles a tu carrito</text>
    <text x="600" y="430" text-anchor="middle" class="empty-desc">y procede al pago cuando estes listo</text>
    <rect x="430" y="470" width="340" height="50" rx="8" fill="#3B82F6"/>
    <text x="600" y="502" text-anchor="middle" class="btn-primary">EXPLORAR CARTAS</text>
  </g>

  <g id="footer">
    <rect x="0" y="720" width="1200" height="80" fill="#1F2937"/>
    <text x="600" y="755" text-anchor="middle" class="footer-text">&#xA9; 2026 CardTrade Market. Todos los derechos reservados.</text>
    <text x="600" y="775" text-anchor="middle" class="footer-link">Terminos | Privacidad | Contacto | Ayuda</text>
  </g>
</svg>

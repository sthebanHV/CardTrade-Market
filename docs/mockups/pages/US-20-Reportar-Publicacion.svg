<svg viewBox="0 0 1200 1050" xmlns="http://www.w3.org/2000/svg">
  <title>Reportar Publicacion</title>
  <desc>Wireframe de formulario para reportar una publicacion con motivo del reporte y detalles</desc>
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cardShadow"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .page-title{font-size:24px;font-weight:700;fill:#111827}
    .section-title{font-size:18px;font-weight:700;fill:#111827}
    .label{font-size:13px;font-weight:500;fill:#374151}
    .input-text{font-size:14px;fill:#111827}
    .card-meta{font-size:12px;fill:#6B7280}
    .card-price{font-size:18px;font-weight:700;fill:#3B82F6}
    .header-text{font-size:20px;font-weight:700;fill:white}
    .muted{font-size:14px;fill:#6B7280}
    .small-muted{font-size:12px;fill:#6B7280}
    .placeholder{font-size:14px;fill:#9CA3AF}
    .footer-text{font-size:12px;fill:#9CA3AF}
    .footer-link{font-size:12px;fill:#6B7280}
    .option-text{font-size:14px;fill:#111827}
    .option-desc{font-size:12px;fill:#6B7280}
  </style>
  <rect width="1200" height="1050" fill="#F3F4F6"/>

  <g id="header">
    <rect width="1200" height="64" fill="url(#headerGrad)"/>
    <text x="40" y="42" class="header-text">&#x1F0CF; CardTrade Market</text>
  </g>

  <g id="main-content">
    <text x="60" y="115" class="page-title">REPORTAR PUBLICACION</text>
    <text x="60" y="145" class="muted">Ayudanos a mantener la comunidad segura</text>

    <!-- Card Preview -->
    <rect x="60" y="170" width="1080" height="160" rx="12" fill="white" filter="url(#cardShadow)"/>
    <rect x="85" y="195" width="110" height="110" rx="12" fill="#FEF3C7"/>
    <text x="140" y="260" text-anchor="middle" font-size="48">&#x1F0CF;</text>
    <text x="220" y="220" font-size="18" font-weight="600" fill="#111827">Charizard ex 199/165</text>
    <text x="220" y="248" class="label">Por: CardMaster MX &#x2B50; 4.8</text>
    <text x="220" y="275" class="card-price">$45.00</text>
    <text x="220" y="300" class="card-meta">Pokemon &#x2022; Obsidian Flames &#x2022; Ultra Rare</text>

    <!-- Report Form -->
    <rect x="60" y="360" width="1080" height="620" rx="12" fill="white" filter="url(#cardShadow)"/>
    <text x="100" y="405" class="section-title">MOTIVO DEL REPORTE</text>

    <!-- Option 1 -->
    <rect x="100" y="425" width="1000" height="65" rx="8" fill="#F3F4F6"/>
    <rect x="120" y="440" width="22" height="22" rx="4" fill="white" stroke="#3B82F6" stroke-width="2"/>
    <text x="160" y="458" class="option-text">Precio sospechoso / Fraude de precio</text>
    <text x="160" y="478" class="option-desc">Precio muy bajo para carta de alto valor</text>

    <!-- Option 2 -->
    <rect x="100" y="500" width="1000" height="65" rx="8" fill="#F3F4F6"/>
    <rect x="120" y="515" width="22" height="22" rx="4" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="160" y="533" class="option-text">Foto no coincide con la descripcion</text>
    <text x="160" y="553" class="option-desc">Imagen generica o de otra carta</text>

    <!-- Option 3 -->
    <rect x="100" y="575" width="1000" height="65" rx="8" fill="#F3F4F6"/>
    <rect x="120" y="590" width="22" height="22" rx="4" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="160" y="608" class="option-text">Vendedor no responde / Inactivo</text>
    <text x="160" y="628" class="option-desc">Sin respuesta en 48+ horas</text>

    <!-- Option 4 -->
    <rect x="100" y="650" width="1000" height="65" rx="8" fill="#F3F4F6"/>
    <rect x="120" y="665" width="22" height="22" rx="4" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="160" y="683" class="option-text">Informacion enganosa / Estado incorrecto</text>
    <text x="160" y="703" class="option-desc">Carta danada listada como nueva</text>

    <!-- Option 5 -->
    <rect x="100" y="725" width="1000" height="65" rx="8" fill="#F3F4F6"/>
    <rect x="120" y="740" width="22" height="22" rx="4" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="160" y="758" class="option-text">Contenido prohibido / Spam</text>
    <text x="160" y="778" class="option-desc">Enlaces externos, publicidad, etc.</text>

    <!-- Option 6 -->
    <rect x="100" y="800" width="1000" height="65" rx="8" fill="#F3F4F6"/>
    <rect x="120" y="815" width="22" height="22" rx="4" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="160" y="833" class="option-text">Otro motivo</text>

    <!-- Details -->
    <line x1="100" y1="890" x2="1060" y2="890" stroke="#E5E7EB" stroke-width="1"/>
    <text x="100" y="920" class="label">Detalles adicionales (opcional)</text>
    <rect x="100" y="930" width="1000" height="60" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="120" y="965" class="placeholder">Describe el problema con mas detalle...</text>
  </g>

  <g id="footer">
    <rect x="0" y="970" width="1200" height="80" fill="#1F2937"/>
    <text x="600" y="1005" text-anchor="middle" class="footer-text">&#xA9; 2026 CardTrade Market. Todos los derechos reservados.</text>
    <text x="600" y="1025" text-anchor="middle" class="footer-link">Terminos | Privacidad | Contacto | Ayuda</text>
  </g>
</svg>

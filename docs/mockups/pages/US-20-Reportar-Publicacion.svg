<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <title>Reportar Publicacion</title>
  <desc>Wireframe de formulario para reportar una publicacion con motivo del reporte y detalles</desc>
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cardShadow"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .page-title{font-size:24px;font-weight:700;fill:#111827}
    .section-title{font-size:16px;font-weight:700;fill:#111827}
    .label{font-size:13px;font-weight:500;fill:#374151}
    .input-text{font-size:14px;fill:#111827}
    .card-meta{font-size:12px;fill:#6B7280}
    .card-price{font-size:14px;font-weight:700;fill:#3B82F6}
    .header-text{font-size:20px;font-weight:700;fill:white}
    .muted{font-size:14px;fill:#6B7280}
    .small-muted{font-size:12px;fill:#6B7280}
    .placeholder{font-size:14px;fill:#9CA3AF}
    .footer-text{font-size:12px;fill:#9CA3AF}
    .footer-link{font-size:12px;fill:#6B7280}
  </style>
  <rect width="1200" height="900" fill="#F3F4F6"/>
  <g id="header">
    <rect width="1200" height="64" fill="url(#headerGrad)"/>
    <text x="40" y="42" class="header-text">&#x1F0CF; CardTrade Market</text>
  </g>
  <g id="main-content">
    <text x="60" y="110" class="page-title">REPORTAR PUBLICACION</text>
    <text x="60" y="135" class="muted">Ayudanos a mantener la comunidad segura</text>
    <rect x="60" y="155" width="1080" height="180" rx="12" fill="white" filter="url(#cardShadow)"/>
    <rect x="80" y="175" width="140" height="140" rx="12" fill="#FEF3C7"/>
    <text x="150" y="255" text-anchor="middle" font-size="48">&#x1F0CF;</text>
    <text x="250" y="210" font-size="18" font-weight="600" fill="#111827">Charizard ex 199/165</text>
    <text x="250" y="235" class="label">Por: CardMaster MX &#x2B50; 4.8</text>
    <text x="250" y="255" font-size="16" font-weight="700" fill="#3B82F6">.00</text>
    <text x="250" y="280" class="card-meta">Pokemon &#x2022; Obsidian Flames &#x2022; Ultra Rare</text>
    <rect x="60" y="360" width="1080" height="480" rx="12" fill="white" filter="url(#cardShadow)"/>
    <text x="100" y="405" class="section-title">MOTIVO DEL REPORTE</text>
    <rect x="100" y="430" width="1000" height="56" rx="8" fill="#F3F4F6"/>
    <rect x="120" y="438" width="24" height="24" rx="4" fill="white" stroke="#3B82F6" stroke-width="2"/>
    <text x="160" y="468" class="input-text">Precio sospechoso / Fraude de precio</text>
    <text x="950" y="468" class="small-muted">Precio muy bajo para carta de alto valor</text>
    <rect x="100" y="495" width="1000" height="56" rx="8" fill="#F3F4F6"/>
    <rect x="120" y="503" width="24" height="24" rx="4" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="160" y="533" class="input-text">Foto no coincide con la descripcion</text>
    <text x="950" y="533" class="small-muted">Imagen generica o de otra carta</text>
    <rect x="100" y="560" width="1000" height="56" rx="8" fill="#F3F4F6"/>
    <rect x="120" y="568" width="24" height="24" rx="4" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="160" y="598" class="input-text">Vendedor no responde / Inactivo</text>
    <text x="950" y="598" class="small-muted">Sin respuesta en 48+ horas</text>
    <rect x="100" y="625" width="1000" height="56" rx="8" fill="#F3F4F6"/>
    <rect x="120" y="633" width="24" height="24" rx="4" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="160" y="663" class="input-text">Informacion enganosa / Estado incorrecto</text>
    <text x="950" y="663" class="small-muted">Carta danada listada como nueva</text>
    <rect x="100" y="690" width="1000" height="56" rx="8" fill="#F3F4F6"/>
    <rect x="120" y="698" width="24" height="24" rx="4" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="160" y="728" class="input-text">Contenido prohibido / Spam</text>
    <text x="950" y="728" class="small-muted">Enlaces externos, publicidad, etc.</text>
    <rect x="100" y="755" width="1000" height="56" rx="8" fill="#F3F4F6"/>
    <rect x="120" y="763" width="24" height="24" rx="4" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="160" y="793" class="input-text">Otro motivo</text>
    <line x1="100" y1="830" x2="1060" y2="830" stroke="#E5E7EB" stroke-width="1"/>
    <text x="100" y="855" class="label">Detalles adicionales (opcional)</text>
    <rect x="100" y="860" width="1000" height="60" rx="8" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="120" y="895" class="placeholder">Describe el problema con mas detalle...</text>
  </g>
  <g id="footer">
    <rect x="0" y="820" width="1200" height="80" fill="#1F2937"/>
    <text x="600" y="855" text-anchor="middle" class="footer-text">&#xA9; 2026 CardTrade Market. Todos los derechos reservados.</text>
    <text x="600" y="875" text-anchor="middle" class="footer-link">Terminos | Privacidad | Contacto | Ayuda</text>
  </g>
</svg>